<script>
// =====================================================================
// kumul-render.js — Kumul ailesinin görsel kimliği: gündüz çölü, kum zemin, kapanan kum fırtınası.
// Çekirdeği (render-temel.js) genişletir. Zemin, fırtına, yemler, güçler ve HUD buradadır;
// oyuncuların kendisini (yılan ya da böcek) alt sınıf çizer: drawSnake(s, isPlayer).
// =====================================================================

const KUMUL = {
  sand: '#e8d5a9', sandDark: '#d6bf8a', sandLight: '#f3e6c4',
  ink: '#2a1f14', muted: '#7a6548', paper: 'rgba(253,249,238,0.9)',
  storm: '#b5532e', stormEdge: '#7f2a12',
  teal: '#0e7c7b', crimson: '#c1121f', amber: '#d97706',
  font: 'Rubik, system-ui, sans-serif',
};
const GEM_COLORS = ['#0e7c7b', '#c1121f', '#1d3a8a', '#1f9d55', '#6d28d9', '#db2777', '#f77f00', '#1b1b1e'];
const POWER_LOOK = {
  shield: { color: KUMUL.teal },
  magnet: { color: KUMUL.crimson },
  turbo:  { color: KUMUL.amber },
  anchor: { color: '#3d348b' },
};

class ArenaRenderer extends RenderBase {
  constructor(canvas, opts) {
    super(canvas, opts);
    this.nameColor = KUMUL.ink;
    this.ringColor = 'rgba(42,31,20,0.7)';
    this.sand = null; this.streaks = null;
    this.gems = new Map();
    this.hudText = { size: 'UZUNLUK', kills: 'AV' };   // oyuna göre değişen HUD başlıkları
    this.shake = 0;                                    // 0..1, darbe gücü
    this.toast = null;                                 // { text, t }: kısa bildirim
    this.touchLayout = false;                          // dokunmatik yerleşim: mini harita sağ üste çıkar
    this.stick = null;                                 // sanal joystick: { x, y, dx, dy, r, active } ya da null
    this.stamp = null;                                 // vurgu damgası: { text, sub, t }
    this.zoomBoost = 1;                                // vurgu anında kamera yakınlaşması
    this.streamer = false;                             // yayıncı kipi: büyük isimler, elenme akışı, sohbet skoru
    this.feed = [];                                    // elenme akışı: { text, t }
    this.scoreLine = '';                               // "Sohbet 3 · Yayıncı 2"
    this.reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  showToast(text) { this.toast = { text, t: this.time }; }
  showStamp(text, sub) { this.stamp = { text, sub, t: this.time }; }
  showTip(text, life = 5) { this.tip = { text, t: this.time, life }; }

  // Öğretme baloncuğu: alt ortada, birkaç saniye kalır (bildirimden daha uzun ve daha büyük)
  drawTip() {
    const tp = this.tip; if (!tp) return;
    const age = this.time - tp.t;
    if (age > tp.life) { this.tip = null; return; }
    const ctx = this.ctx, W = this.viewW, H = this.viewH, alpha = age < 0.25 ? age / 0.25 : age > tp.life - 0.4 ? (tp.life - age) / 0.4 : 1;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.font = `700 15px ${KUMUL.font}`; ctx.textAlign = 'center';
    const w = Math.min(W - 24, ctx.measureText(tp.text).width + 44), y = H - (this.touchLayout ? 150 : 96);
    ctx.fillStyle = KUMUL.ink;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(W / 2 - w / 2, y, w, 40, 20); else ctx.rect(W / 2 - w / 2, y, w, 40); ctx.fill();
    ctx.fillStyle = KUMUL.amber; ctx.beginPath(); ctx.arc(W / 2 - w / 2 + 20, y + 20, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fdf9ee'; ctx.fillText(tp.text, W / 2 + 10, y + 26);
    ctx.restore();
  }
  pushFeed(text) { this.feed.push({ text, t: this.time }); if (this.feed.length > 5) this.feed.shift(); }

  // Yayıncı kipi: sağda elenme akışı (son 5), üstte sohbet-yayıncı skoru. Sol alt webcam için boş bırakılır.
  drawStreamerHud(cornerY) {
    if (!this.streamer) return;
    const ctx = this.ctx, W = this.viewW;
    if (this.scoreLine) {
      ctx.font = `700 13px ${KUMUL.font}`; ctx.textAlign = 'center';
      const w = ctx.measureText(this.scoreLine).width + 28;
      this.panel(W / 2 - w / 2, 78, w, 26, 13);
      ctx.fillStyle = KUMUL.ink; ctx.fillText(this.scoreLine, W / 2, 96);
    }
    const rows = this.feed.filter(f => this.time - f.t < 8);
    if (!rows.length) return;
    const lw = 190, x = W - lw - 10;
    this.panel(x, cornerY, lw, 10 + rows.length * 18);
    ctx.font = `500 12px ${KUMUL.font}`; ctx.textAlign = 'left';
    rows.forEach((f, i) => { ctx.fillStyle = `rgba(42,31,20,${Math.min(1, (8 - (this.time - f.t)) / 2)})`; ctx.fillText(f.text, x + 10, cornerY + 20 + i * 18); });
  }

  // Damga: ekranın ortasına çarpar gibi gelen büyük yazı. Sessiz izlenen klipte bile anı anlatır.
  drawStamp() {
    const st = this.stamp; if (!st) return;
    const age = this.time - st.t, LIFE = 1.7;
    if (age > LIFE) { this.stamp = null; return; }
    const ctx = this.ctx, W = this.viewW, H = this.viewH;
    const pop = age < 0.12 ? 1.8 - age / 0.12 * 0.8 : 1, alpha = age > LIFE - 0.4 ? (LIFE - age) / 0.4 : 1;
    const size = Math.min(72, W * 0.13);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, H * 0.36); ctx.rotate(-0.06); ctx.scale(pop, pop);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${size}px ${KUMUL.font}`;
    ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = '#fdf9ee'; ctx.strokeText(st.text, 0, 0);
    ctx.fillStyle = KUMUL.crimson; ctx.fillText(st.text, 0, 0);
    if (st.sub) {
      ctx.font = `600 ${Math.round(size * 0.26)}px ${KUMUL.font}`;
      ctx.lineWidth = size * 0.08; ctx.strokeText(st.sub, 0, size * 0.72);
      ctx.fillStyle = KUMUL.ink; ctx.fillText(st.sub, 0, size * 0.72);
    }
    ctx.restore();
  }

  // --- Alt sınıfın doldurduğu üç kanca ---
  drawSnake(s, isPlayer) {}            // bir oyuncuyu çiz
  playerChips(player) { return []; }   // sol üstteki durum rozetleri: [simge türü, metin, renk]
  drawEffects(world) {}                // oyunculardan sonra, fırtınadan önce çizilen efektler
  drawOverlay(world, player, vx0, vy0, vx1, vy1) {}   // fırtınadan sonra, HUD'dan önce (dünya uzayı): gece karanlığı gibi

  // Ekran (CSS px) → dünya: draw() ile aynı dönüşüm (sarsıntı yok sayılır). İzlenecek oyuncuyu tıklayarak seçmek için.
  screenToWorld(cx, cy) {
    const scale = this.zoom * this.dpr;
    return { x: this.camX + (cx * this.dpr - this.canvas.width / 2) / scale, y: this.camY + (cy * this.dpr - this.canvas.height / 2) / scale };
  }
  draw(world, player, round, spectating) {
    const ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
    const scale = this.zoom * this.dpr;
    this.clampCamera();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = KUMUL.sand;
    ctx.fillRect(0, 0, W, H);
    // Sarsıntı: sert darbede ekran kısa süre titrer (hareket azaltma tercihinde kapalı)
    let sx = 0, sy = 0;
    if (this.shake > 0.02 && !this.reduceMotion) {
      sx = (Math.random() - 0.5) * this.shake * 16 * this.dpr; sy = (Math.random() - 0.5) * this.shake * 16 * this.dpr;
      this.shake *= 0.86;
    } else this.shake = 0;
    ctx.setTransform(scale, 0, 0, scale, W / 2 - this.camX * scale + sx, H / 2 - this.camY * scale + sy);

    const vw = W / scale, vh = H / scale;
    const vx0 = this.camX - vw / 2, vy0 = this.camY - vh / 2, vx1 = vx0 + vw, vy1 = vy0 + vh;
    const visible = (x, y, m = 40) => x > vx0 - m && x < vx1 + m && y > vy0 - m && y < vy1 + m;

    // Kum zemin
    ctx.fillStyle = this.sandPattern();
    ctx.fillRect(vx0, vy0, vw, vh);

    // Yemler: küçük taşlar
    for (const f of world.foods) {
      if (!visible(f.x, f.y)) continue;
      const g = this.gemSprite(f);
      ctx.drawImage(g.canvas, f.x - g.size / 2, f.y - g.size / 2, g.size, g.size);
    }
    for (const p of world.powerUps) if (visible(p.x, p.y)) this.drawPower(p);

    // Yılanlar: küçükten büyüğe
    const alive = world.snakes.filter(s => s.alive).sort((a, b) => a.mass - b.mass);
    for (const s of alive) {
      if (!visible(s.x, s.y, s.bodyLength || 800)) continue;
      this.drawSnake(s, s === player);
    }
    this.drawEffects(world);

    // Fırtına en üstte: sınırın dışında kalan her şeyi örter
    this.drawStorm(world.bounds, vx0, vy0, vx1, vy1);
    this.drawOverlay(world, player, vx0, vy0, vx1, vy1);

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (round) this.drawArenaHud(world, player, round, spectating);
  }

  // Kum deseni: bir kez çizilir, sonra tekrarlanır
  sandPattern() {
    if (this.sand) return this.sand;
    const T = 256, c = document.createElement('canvas'); c.width = c.height = T;
    const g = c.getContext('2d');
    g.fillStyle = KUMUL.sand; g.fillRect(0, 0, T, T);
    // Rüzgâr izleri: dönemi karoya tam sığan sinüsler (dikişsiz)
    for (let row = 0; row < 8; row++) {
      const y0 = row * 32 + 16, phase = row * 1.7;
      for (const [color, off] of [[KUMUL.sandDark, 0], [KUMUL.sandLight, 3]]) {
        g.strokeStyle = color; g.lineWidth = 2; g.globalAlpha = 0.55;
        g.beginPath();
        for (let x = 0; x <= T; x += 8) {
          const y = y0 + off + Math.sin((x / T) * Math.PI * 4 + phase) * 5;
          if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
    }
    // Kum taneleri (sabit tohumlu)
    g.globalAlpha = 1;
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 70; i++) {
      g.fillStyle = i % 3 ? 'rgba(122,101,72,0.22)' : 'rgba(255,255,255,0.35)';
      g.beginPath(); g.arc(6 + rnd() * (T - 12), 6 + rnd() * (T - 12), 0.8 + rnd() * 1.1, 0, Math.PI * 2); g.fill();
    }
    return (this.sand = this.ctx.createPattern(c, 'repeat'));
  }

  // Fırtına çizgileri: çapraz, dikişsiz, zamanla kayar
  streakPattern() {
    if (!this.streaks) {
      const T = 128, c = document.createElement('canvas'); c.width = c.height = T;
      const g = c.getContext('2d');
      g.lineCap = 'round';
      for (let k = -4; k <= 4; k++) {
        const x = k * 32;
        g.strokeStyle = k % 2 ? 'rgba(255,225,190,0.20)' : 'rgba(90,30,10,0.22)';
        g.lineWidth = k % 2 ? 3 : 5;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x + T, T); g.stroke();
      }
      this.streaks = this.ctx.createPattern(c, 'repeat');
    }
    if (this.streaks.setTransform) {
      const m = new DOMMatrix(); m.e = (this.time * 110) % 128; m.f = (this.time * 110) % 128;
      this.streaks.setTransform(m);
    }
    return this.streaks;
  }

  drawStorm(b, vx0, vy0, vx1, vy1) {
    const ctx = this.ctx;
    const rects = [];
    if (b.x0 > vx0) rects.push([vx0, vy0, b.x0 - vx0, vy1 - vy0]);
    if (b.x1 < vx1) rects.push([b.x1, vy0, vx1 - b.x1, vy1 - vy0]);
    const ix0 = Math.max(vx0, b.x0), ix1 = Math.min(vx1, b.x1);
    if (ix1 > ix0) {
      if (b.y0 > vy0) rects.push([ix0, vy0, ix1 - ix0, b.y0 - vy0]);
      if (b.y1 < vy1) rects.push([ix0, b.y1, ix1 - ix0, vy1 - b.y1]);
    }
    if (rects.length) {
      ctx.beginPath(); for (const r of rects) ctx.rect(...r);
      ctx.fillStyle = 'rgba(181,83,46,0.88)'; ctx.fill();
      ctx.fillStyle = this.streakPattern(); ctx.fill();
    }
    // Sınırın içine doğru solan uyarı bandı
    const side = b.x1 - b.x0, band = Math.min(80, side / 3);
    if (band > 4) {
      const strips = [
        [b.x0, b.y0, band, b.y1 - b.y0, b.x0, 0, b.x0 + band, 0],
        [b.x1 - band, b.y0, band, b.y1 - b.y0, b.x1, 0, b.x1 - band, 0],
        [b.x0, b.y0, b.x1 - b.x0, band, 0, b.y0, 0, b.y0 + band],
        [b.x0, b.y1 - band, b.x1 - b.x0, band, 0, b.y1, 0, b.y1 - band],
      ];
      for (const [x, y, w, h, gx0, gy0, gx1, gy1] of strips) {
        const gr = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
        gr.addColorStop(0, 'rgba(181,83,46,0.38)'); gr.addColorStop(1, 'rgba(181,83,46,0)');
        ctx.fillStyle = gr; ctx.fillRect(x, y, w, h);
      }
    }
    ctx.strokeStyle = KUMUL.stormEdge; ctx.lineWidth = 5 / this.zoom;
    ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  }

  // Yem: gölgeli küçük taş, renk + boy kovasına göre önbelleklenir
  gemSprite(f) {
    if (!f.color) f.color = f.edge ? KUMUL.amber : GEM_COLORS[((f.x * 7 + f.y * 13) | 0) % GEM_COLORS.length];   // kenar yemi: kehribar
    const r = Math.round((3.2 + f.value * 1.0) * 2) / 2;
    const key = f.color + ':' + r;
    let spr = this.gems.get(key);
    if (spr) return spr;
    const S = 4, size = r * 3.2, c = document.createElement('canvas');
    c.width = c.height = Math.ceil(size * S);
    const g = c.getContext('2d'), cx = c.width / 2, cy = c.height / 2;
    g.fillStyle = 'rgba(60,40,15,0.22)'; g.beginPath(); g.ellipse(cx + r * S * 0.2, cy + r * S * 0.45, r * S, r * S * 0.7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = this.darken(f.color, 0.3); g.beginPath(); g.arc(cx, cy, r * S, 0, Math.PI * 2); g.fill();
    g.fillStyle = f.color; g.beginPath(); g.arc(cx - r * S * 0.08, cy - r * S * 0.1, r * S * 0.84, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.arc(cx - r * S * 0.32, cy - r * S * 0.34, r * S * 0.28, 0, Math.PI * 2); g.fill();
    spr = { canvas: c, size };
    this.gems.set(key, spr);
    return spr;
  }

  drawPower(p) {
    const ctx = this.ctx, look = POWER_LOOK[p.type];
    const r = 15 * (1 + 0.07 * Math.sin(this.time * 5 + p.id)), x = p.x, y = p.y;
    ctx.fillStyle = 'rgba(60,40,15,0.22)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 7, r, r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fdfcf7'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = look.color; ctx.lineWidth = 3; ctx.stroke();
    this.powerGlyph(p.type, x, y, 1);
  }

  // Güç simgesi (dünya veya ekran koordinatında; k = ölçek)
  // HUD rozet simgeleri: tek renk, ince çizgi, 16 px kutu. Dünyadaki güç parıltıları (powerGlyph) ayrı kalır.
  chipIcon(type, x, y, color) {
    const ctx = this.ctx;
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.75; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    switch (type) {
      case 'shield':   // kalkan: sivri uçlu dış hat
        ctx.moveTo(x, y - 7); ctx.lineTo(x + 6, y - 4.5); ctx.lineTo(x + 5.5, y + 1); ctx.quadraticCurveTo(x + 4, y + 5.5, x, y + 7.5);
        ctx.quadraticCurveTo(x - 4, y + 5.5, x - 5.5, y + 1); ctx.lineTo(x - 6, y - 4.5); ctx.closePath(); ctx.stroke(); break;
      case 'dash':     // çift ok: hız
        ctx.moveTo(x - 6, y - 5); ctx.lineTo(x - 1, y); ctx.lineTo(x - 6, y + 5);
        ctx.moveTo(x + 1, y - 5); ctx.lineTo(x + 6, y); ctx.lineTo(x + 1, y + 5); ctx.stroke(); break;
      case 'launch':   // fırlatma: daire içinden çıkan ok
        ctx.arc(x - 1.5, y + 1.5, 5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 1.5, y + 1.5); ctx.lineTo(x + 6.5, y - 6.5); ctx.moveTo(x + 1.5, y - 6.5); ctx.lineTo(x + 6.5, y - 6.5); ctx.lineTo(x + 6.5, y - 1.5); ctx.stroke(); break;
      case 'dig':      // kazı: zemin çizgisi ve aşağı ok
        ctx.moveTo(x - 7, y + 6.5); ctx.lineTo(x + 7, y + 6.5); ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 3);
        ctx.moveTo(x - 4, y - 1); ctx.lineTo(x, y + 3); ctx.lineTo(x + 4, y - 1); ctx.stroke(); break;
      case 'ball':     // topsuz: üstü çizili daire
        ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 4.5, y + 4.5); ctx.lineTo(x + 4.5, y - 4.5); ctx.stroke(); break;
      case 'magnet':   // mıknatıs: U gövde ve iki kutup
        ctx.moveTo(x - 5, y - 6.5); ctx.lineTo(x - 5, y + 1); ctx.arc(x, y + 1, 5, Math.PI, 0, true); ctx.lineTo(x + 5, y - 6.5); ctx.stroke();
        ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 5, y - 6); ctx.lineTo(x - 5, y - 3.5); ctx.moveTo(x + 5, y - 6); ctx.lineTo(x + 5, y - 3.5); ctx.stroke(); break;
      case 'turbo':    // turbo: şimşek dış hat
        ctx.moveTo(x + 1.5, y - 7.5); ctx.lineTo(x - 4.5, y + 1); ctx.lineTo(x - 0.5, y + 1); ctx.lineTo(x - 1.5, y + 7.5); ctx.lineTo(x + 4.5, y - 1); ctx.lineTo(x + 0.5, y - 1); ctx.closePath(); ctx.stroke(); break;
      case 'anchor':   // ağırlık: halkalı blok
        ctx.moveTo(x - 4, y - 2); ctx.lineTo(x + 4, y - 2); ctx.lineTo(x + 6.5, y + 7); ctx.lineTo(x - 6.5, y + 7); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y - 4.5, 2.5, 0, Math.PI * 2); ctx.stroke(); break;
      default: ctx.restore(); return this.powerGlyph(type, x, y, 0.8);
    }
    ctx.restore();
  }

  powerGlyph(type, x, y, k) {
    const ctx = this.ctx, c = POWER_LOOK[type].color;
    ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    if (type === 'shield') {
      ctx.moveTo(x - 6 * k, y - 7 * k); ctx.lineTo(x + 6 * k, y - 7 * k); ctx.lineTo(x + 6 * k, y);
      ctx.quadraticCurveTo(x + 6 * k, y + 6 * k, x, y + 8 * k); ctx.quadraticCurveTo(x - 6 * k, y + 6 * k, x - 6 * k, y);
      ctx.closePath(); ctx.fill();
    } else if (type === 'magnet') {
      ctx.lineWidth = 4 * k;
      ctx.moveTo(x - 5 * k, y - 6 * k); ctx.lineTo(x - 5 * k, y + 1 * k);
      ctx.arc(x, y + 1 * k, 5 * k, Math.PI, 0, true);
      ctx.lineTo(x + 5 * k, y - 6 * k); ctx.stroke();
    } else if (type === 'anchor') {
      ctx.moveTo(x - 4 * k, y - 3 * k); ctx.lineTo(x + 4 * k, y - 3 * k); ctx.lineTo(x + 7 * k, y + 7 * k); ctx.lineTo(x - 7 * k, y + 7 * k);
      ctx.closePath(); ctx.fill();
      ctx.lineWidth = 2 * k; ctx.beginPath(); ctx.arc(x, y - 5.5 * k, 2.5 * k, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.moveTo(x + 1 * k, y - 8 * k); ctx.lineTo(x - 5 * k, y + 1 * k); ctx.lineTo(x - 1 * k, y + 1 * k);
      ctx.lineTo(x - 2 * k, y + 8 * k); ctx.lineTo(x + 5 * k, y - 2 * k); ctx.lineTo(x + 1 * k, y - 2 * k);
      ctx.closePath(); ctx.fill();
    }
  }

  // --- HUD yapı taşları: lobi panelleriyle aynı dil (kağıt zemin, mürekkep çerçeve, offset gölge, büyük harf etiket) ---
  rrect(x, y, w, h, r) { const ctx = this.ctx; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
  panel(x, y, w, h, r = 12, opts = {}) {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(42,31,20,0.16)'; this.rrect(x, y + 3, w, h, r); ctx.fill();
    ctx.fillStyle = opts.fill || KUMUL.paper; ctx.strokeStyle = opts.stroke || KUMUL.ink; ctx.lineWidth = opts.line || 1.5;
    this.rrect(x, y, w, h, r); ctx.fill(); ctx.stroke();
  }
  label(text, x, y, align = 'left', color = KUMUL.muted) {
    const ctx = this.ctx, code = typeof Lang !== 'undefined' ? Lang.code : 'tr';
    ctx.save(); ctx.textAlign = align; ctx.fillStyle = color; ctx.font = `700 ${['ar', 'zh', 'ja', 'ko', 'hi'].includes(code) ? 11 : 10}px ${KUMUL.font}`;
    try { ctx.letterSpacing = code === 'ar' ? '0px' : '1.2px'; } catch {}   // Arapça harfler bitişik: aralık verilmez
    ctx.fillText(String(text).toLocaleUpperCase(code), x, y); ctx.restore();
  }
  bar(x, y, w, h, frac, color) {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(42,31,20,0.12)'; this.rrect(x, y, w, h, h / 2); ctx.fill();
    if (frac > 0) { ctx.fillStyle = color; this.rrect(x, y, Math.max(h, w * Math.min(1, frac)), h, h / 2); ctx.fill(); }
  }
  clipName(name, maxW) {
    const ctx = this.ctx; if (ctx.measureText(name).width <= maxW) return name;
    let s = name; while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }

  drawArenaHud(world, player, round, spectating) {
    const ctx = this.ctx, W = window.innerWidth, H = window.innerHeight;
    const alive = world.snakes.filter(s => s.alive).sort((a, b) => b.mass - a.mass);
    const ph = round.phase();

    // Üst orta: KALAN sayacı + evre etiketi + tur ilerleme çubuğu. Dar ekranda sağa yaslanır (sol paneli örtmesin).
    const narrow = W < 560;
    // Dar ekranda sol oyuncu paneli (10..154) ile çakışmasın: panel daralır, evre etiketi ikinci satıra iner
    const pw = narrow ? Math.max(150, Math.min(204, W - 174)) : 224, ptop = 10, px = narrow ? W - pw - 10 : W / 2 - pw / 2;
    this.panel(px, ptop, pw, 66);
    this.label(T('left'), px + 14, ptop + 21);
    ctx.textAlign = 'left'; ctx.fillStyle = KUMUL.ink; ctx.font = `800 26px ${KUMUL.font}`;
    const n = String(alive.length), nw = ctx.measureText(n).width; ctx.fillText(n, px + 14, ptop + 51);
    ctx.fillStyle = KUMUL.muted; ctx.font = `600 13px ${KUMUL.font}`;
    ctx.fillText(`‎/ ${round.total}`, px + 14 + nw + 6, ptop + 51);   // LRM: RTL dillerde '16 /' olmasın
    const phaseColor = ph.key === 'calm' ? KUMUL.muted : KUMUL.storm;
    const label = ph.key === 'calm' ? T('phaseCalm', Math.ceil(ph.left)) : ph.key === 'shrink' ? T('phaseShrink') : ph.key === 'final3' ? T('phaseFinal3', Math.ceil(ph.left)) : ph.key === 'over' ? T('roundOver') : T('phaseFinal');
    if (narrow) {
      this.bar(px + 70, ptop + 15, pw - 84, 6, round.time / ARENA.finalEnd, phaseColor);
      this.label(label, px + pw - 14, ptop + 51, 'right', phaseColor);
    } else {
      this.label(label, px + pw - 14, ptop + 21, 'right', phaseColor);
      this.bar(px + 96, ptop + 42, pw - 110, 6, round.time / ARENA.finalEnd, phaseColor);
    }

    // Sol üst: oyuncu kutucuğu (ağırlık | itiş) ve altında durum rozetleri
    if (player && player.alive) {
      const lw = 144;
      this.panel(10, 10, lw, 66);
      this.label(this.hudText.size, 22, 31); this.label(this.hudText.kills, 94, 31);
      ctx.textAlign = 'left'; ctx.fillStyle = KUMUL.ink; ctx.font = `800 22px ${KUMUL.font}`;
      ctx.fillText(String(Math.round(player.mass)), 22, 59); ctx.fillText(String(player.kills || 0), 94, 59);
      ctx.fillStyle = 'rgba(42,31,20,0.15)'; ctx.fillRect(82, 22, 1.5, 42);
      const chips = this.playerChips(player);
      let cy = 88;
      for (const [type, text, color] of chips) {
        ctx.font = `600 12px ${KUMUL.font}`;
        const w = ctx.measureText(text).width + 44;
        this.panel(10, cy, w, 28, 14);
        this.chipIcon(type, 26, cy + 14, color);
        ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(text, 40, cy + 18);
        cy += 34;
      }
    }

    // Sağ üst: EN BÜYÜK listesi (dar ekranda gizli): sıra, renk noktası, ad, ağırlık; kendi satırın amber bantlı
    let cornerY = 86;
    if (!narrow) {
      const rows = alive.slice(0, 5), lw = 176, rh = 19, x = W - lw - 10, top = 10, h = 30 + rows.length * rh + 8;
      cornerY = top + h + 12;
      this.panel(x, top, lw, h);
      this.label(T('biggest'), x + 14, top + 21);
      rows.forEach((s, i) => {
        const y = top + 30 + i * rh, me = s === player;
        if (me) { ctx.fillStyle = 'rgba(242,161,4,0.22)'; this.rrect(x + 6, y, lw - 12, rh, 6); ctx.fill(); }
        ctx.textAlign = 'center'; ctx.fillStyle = KUMUL.muted; ctx.font = `700 10px ${KUMUL.font}`; ctx.fillText(String(i + 1), x + 18, y + 13);
        ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(x + 32, y + rh / 2, 4, 0, Math.PI * 2); ctx.fill();
        if (s.nemesis) { ctx.strokeStyle = KUMUL.crimson; ctx.lineWidth = 1.5; ctx.stroke(); }
        ctx.fillStyle = KUMUL.ink; ctx.font = `${me ? 700 : 500} 12px ${KUMUL.font}`; ctx.textAlign = 'left';
        ctx.fillText(this.clipName(s.name, lw - 92), x + 42, y + 13);
        ctx.textAlign = 'right'; ctx.font = `700 12px ${KUMUL.font}`; ctx.fillText(String(Math.round(s.mass)), x + lw - 14, y + 13);
      });
    }

    // Mini harita: çerçeveli, yuvarlak köşeli (fırtına + güvenli alan + oyuncular). Masaüstünde sağ altta;
    // dokunmatikte sağ alt atılma düğmesine ayrıldığı için sağ üste, panellerin altına çıkar.
    const touch = this.touchLayout;
    const ms = touch ? 76 : 96, mx = W - ms - (touch ? 10 : 12), my = touch ? cornerY : H - ms - 14;
    const k = ms / ARENA.size, b = world.bounds;
    ctx.fillStyle = 'rgba(42,31,20,0.16)'; this.rrect(mx, my + 3, ms, ms, 8); ctx.fill();
    ctx.save(); this.rrect(mx, my, ms, ms, 8); ctx.clip();
    ctx.fillStyle = 'rgba(181,83,46,0.9)'; ctx.fillRect(mx, my, ms, ms);
    ctx.fillStyle = KUMUL.sandLight; ctx.fillRect(mx + b.x0 * k, my + b.y0 * k, (b.x1 - b.x0) * k, (b.y1 - b.y0) * k);
    for (const s of alive) {
      if (s === player) continue;
      ctx.fillStyle = s.nemesis ? KUMUL.crimson : s.color;
      ctx.beginPath(); ctx.arc(mx + s.x * k, my + s.y * k, s.nemesis ? 3 : 2, 0, Math.PI * 2); ctx.fill();
    }
    if (player && player.alive) {
      ctx.fillStyle = '#fdf9ee'; ctx.beginPath(); ctx.arc(mx + player.x * k, my + player.y * k, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = KUMUL.ink; ctx.beginPath(); ctx.arc(mx + player.x * k, my + player.y * k, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = KUMUL.ink; ctx.lineWidth = 1.5; this.rrect(mx, my, ms, ms, 8); ctx.stroke();

    this.drawStreamerHud(touch ? cornerY + ms + 10 : cornerY);

    const noteY = narrow ? 176 : this.streamer ? 116 : 86;      // bildirim ve izleme etiketi: dar ekranda panellerin altına iner
    if (!spectating && this.toast && this.time - this.toast.t < 1.8) {
      const age = this.time - this.toast.t, alpha = age > 1.4 ? (1.8 - age) / 0.4 : 1;
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center'; ctx.font = `700 13px ${KUMUL.font}`;
      const w = ctx.measureText(this.toast.text).width + 34;
      ctx.fillStyle = KUMUL.ink; this.rrect(W / 2 - w / 2, noteY, w, 30, 15); ctx.fill();
      ctx.fillStyle = '#fdf9ee'; ctx.fillText(this.toast.text, W / 2, noteY + 20);
      ctx.globalAlpha = 1;
    }

    if (spectating) {
      ctx.font = `600 12px ${KUMUL.font}`;
      const text = T('watching', spectating.name), w = ctx.measureText(text).width + 32;
      this.panel(W / 2 - w / 2, noteY - 2, w, 28, 14);
      ctx.textAlign = 'center'; ctx.fillStyle = KUMUL.ink; ctx.fillText(text, W / 2, noteY + 17);
    }

    if (this.stick) this.drawStick(this.stick);
    if (!spectating) this.drawTip();
    this.drawStamp();
  }

  // Sanal joystick: taban halkası ve parmağı izleyen topuz. Konum ve sapma kumul-main.js'ten gelir.
  drawStick(st) {
    const ctx = this.ctx;
    ctx.globalAlpha = st.active ? 0.9 : 0.5;
    ctx.fillStyle = 'rgba(253,249,238,0.7)'; ctx.strokeStyle = KUMUL.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = KUMUL.ink;
    ctx.beginPath(); ctx.arc(st.x + st.dx, st.y + st.dy, st.r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

</script>
<script>
// =====================================================================
// kumul-yilan-render.js — Kumul'un yılanlı kipinin oyuncu çizimi.
// Yalnızca kumul.html yükler; Skarabe paketine girmez.
// =====================================================================

class KumulSnakeRenderer extends ArenaRenderer {
  playerChips(player) {
    const chips = [];
    if (player.protection > 0) chips.push(['shield', `Koruma ${Math.ceil(player.protection)}`, KUMUL.ink]);
    if (player.shield) chips.push(['shield', 'Kalkan', KUMUL.teal]);
    if (player.magnet > 0) chips.push(['magnet', `Mıknatıs ${Math.ceil(player.magnet)}`, KUMUL.crimson]);
    if (player.turbo > 0) chips.push(['turbo', `Turbo ${Math.ceil(player.turbo)}`, KUMUL.amber]);
    return chips;
  }

  // Zemin gölgesi + yılan gövdesi + güç göstergeleri
  drawSnake(s, isPlayer) {
    const ctx = this.ctx, r = s.radius;
    ctx.save(); ctx.translate(3, 6);
    ctx.strokeStyle = 'rgba(60,40,15,0.18)'; ctx.lineWidth = r * 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    this.strokeTrail(s, s.trail);
    ctx.restore();
    this.drawSnakeBody(s);
    if (s.shield) {
      ctx.strokeStyle = KUMUL.teal; ctx.lineWidth = 3 / this.zoom;
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.9, 0, Math.PI * 2); ctx.stroke();
    }
    if (s.magnet > 0 && isPlayer) {
      ctx.strokeStyle = 'rgba(193,18,31,0.35)'; ctx.lineWidth = 2 / this.zoom; ctx.setLineDash([8 / this.zoom, 8 / this.zoom]);
      ctx.beginPath(); ctx.arc(s.x, s.y, POWER.magnetRadius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

Object.assign(KumulSnakeRenderer.prototype, SnakeDrawing);

</script>
<script>
// Oyuna özgü ayarlar: ortak akış (kumul-main.js) bunları okur
const GAME = {
  key: 'kumul',
  Renderer: KumulSnakeRenderer,
  firstLine: 'İlk turun. 30 yılan, tek kazanan.',
  winTitle: 'Son yılan sensin',
  winText: n => `${n} yılan arasından birinci.`,
  deathText: p => p.deathCause === 'wall' ? 'Fırtınaya yakalandın.'
                : p.killer ? `${p.killer.name} yolunu kesti.` : 'Bir yılana çarptın.',
  previewActor(skin, W, H) {
    const pts = []; for (let x = W - 28; x > 18; x -= 5) pts.push({ x, y: H / 2 + Math.sin(x / 26) * 5 });
    return { x: W - 28, y: H / 2 + Math.sin((W - 28) / 26) * 5, trail: pts, angle: 0, skin, color: skin[0],
             boosting: false, protection: 0, shield: false, magnet: 0, name: '', radius: 11 };
  },
};
</script>
<script>
// =====================================================================
// kumul-main.js — Kumul ailesinin ortak oyun akışı: menü, tur, elenme/diriliş, sonuç, yeni tur
// Oyuna özgü her şey sayfanın tanımladığı GAME nesnesinden gelir:
//   GAME = { key, Renderer, firstLine, winTitle, winText(total), deathText(player), previewActor(skin, W, H),
//            progress (isteğe bağlı: seviye ve görünüm kilitleri), missions (isteğe bağlı: günlük görevler),
//            outText(name) (isteğe bağlı: rakip düşürünce çıkan bildirim) }
// Durumlar: menu (arkada botlar oynar) -> playing -> dead (izleme) / over (kazandın)
// Sayfada bulunmayan isteğe bağlı öğeler (seviye çubuğu, görev satırı, ses düğmesi) sessizce atlanır.
// =====================================================================

const canvas   = document.getElementById('game');
const renderer = new GAME.Renderer(canvas);
const $ = id => document.getElementById(id);
const setText = (id, text) => { const el = $(id); if (el) el.textContent = text; };
const setHidden = (id, hidden) => { const el = $(id); if (el) el.hidden = hidden; };

let round    = new Round();          // menünün arkasında dönen bot turu
let player   = null;
let state    = 'menu';
let revived  = false;                // tur başına bir diriliş
let awarded  = null;                 // bu turda şimdiye kadar yazılan sonuç (diriliş sonrası fark eklenir)
let overShown = false;

let attractTimer = 0;

if (useProgress) { Progress.init(GAME.key, KUMUL_SKINS, GAME.missions); Nemesis.init(GAME.key); Streak.init(GAME.key); }

// ---------------------------------------------------------------------
// Kademeli öğretme: ilk 10 saniye hyper-casual kalsın, derinlik turlar ilerledikçe açılsın.
//   0. evre (ilk 2 tur): yalnız yön + atılma; basılı tutmak şarj yapmaz, KAZI yok, menüde tek satır.
//   1. evre (3.–4. tur): FIRLAT açılır; kütle 40'ı geçince turda tek ipucu.
//   2. evre (5. turdan ya da seviye 3'ten sonra): KAZI açılır; Sezon, Defter, Yayıncı "Daha fazla" altında.
// İpuçları en çok 3 kez gösterilir; oyuncu hamleyi bir kez yapınca biter.
// ---------------------------------------------------------------------
const Tutor = {
  data: store.get(GAME.key + '-tutor', { launch: 0, dig: 0 }),
  save() { store.set(GAME.key + '-tutor', this.data); },
  stage() { const lvl = useProgress ? Progress.levelInfo().level : 1; return stats.rounds >= 5 || lvl >= 3 ? 2 : stats.rounds >= 2 ? 1 : 0; },
  canLaunch() { return this.stage() >= 1 || !GAME.tutor; },
  canDig() { return this.stage() >= 2 || !GAME.tutor; },
  // Menüdeki tuş kapakları: [tuş, eylem]; evre ilerledikçe satır eklenir
  helpItems() {
    const t = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);   // touch nesnesi daha sonra tanımlanır
    const items = [[T(t ? 'kStick' : 'kMouse'), T('aSteer')], [T(t ? 'kBtn' : 'kClick'), T('aDash')]];
    if (GAME.tutor && this.stage() === 0) return items;
    items.push([T('kHold'), T('aLaunch')]);
    if (!GAME.tutor || this.stage() >= 2) items.push([T(t ? 'kDigBtn' : 'kX'), T('aDig')]);
    return items;
  },
  renderHelp() {
    const box = $('helpText'); if (!box) return;
    box.innerHTML = this.helpItems().map(([k, a]) => `<span class="key"><kbd>${k}</kbd>${a}</span>`).join('');
  },
  // Her karede: oyun içi ipuçları
  tick() {
    if (!GAME.tutor || state !== 'playing' || !player.alive) return;
    if (!this.launchShown && this.stage() >= 1 && !stats.launches && this.data.launch < 3 && player.hasBall && player.mass >= 40) {
      this.launchShown = true; this.data.launch++; this.save();
      renderer.showTip(T(touch.enabled ? 'tipLaunchTouch' : 'tipLaunchMouse'), 5);
    }
    if (!this.digShown && this.stage() >= 2 && !stats.digs && this.data.dig < 3 && player.digEligible) {
      this.digShown = true; this.data.dig++; this.save();
      renderer.showTip(T(touch.enabled ? 'tipDigTouch' : 'tipDigMouse'), 5);
    }
  },
  reset() { this.launchShown = false; this.digShown = false; },
};
function syncTutorMenu() {
  Tutor.renderHelp();
  setHidden('moreBox', GAME.tutor ? Tutor.stage() < 2 : false);
}

  paused = on; setHidden('pauseModal', !on);
  if (on) Ads.gameplayStop(); else { last = performance.now(); acc = 0; Ads.gameplayStart(); }
}
Ads.onAdStart = () => { adPlaying = true; mutedBeforeAd = Sfx.muted; Sfx.setMuted(true); };
Ads.onAdEnd = () => { adPlaying = false; Sfx.setMuted(mutedBeforeAd); last = performance.now(); acc = 0; };

window.addEventListener('keydown', e => {

  if ((e.code !== 'Escape' && e.code !== 'KeyP') || e.target.tagName === 'INPUT') return;
  if (state === 'playing') { setPaused(!paused); e.preventDefault(); return; }
  if (e.code !== 'Escape') return;
  for (const id of ['clipModal', 'seasonModal', 'defterModal']) {   // Esc açık sayfayı kapatır
    const m = $(id); if (!m || m.hidden) continue;
    const b = m.querySelector('button[data-t="close"]'); if (b) b.click(); else m.hidden = true;
    e.preventDefault(); return;

});

// Sezon sayfası: kademe, 10 basamaklı hat, Kum Kutusu (3 karttan biri)
function renderSeason() {
  if (!useSeason) return;
  const cur = Season.current(), esc = s => String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  // Başlık: "SEZON 2" etiketi + kademe adı; kutucuklar: puan / gün / sıradaki kademe; unvan rozet
  setText('seasonLabel', T('seasonLabel', cur.index + 1));
  setText('seasonTitle', T('tier:' + Season.tier()));
  setText('seasonTitlePill', Season.titleName() ? T('titleLabel', Season.titleName()) : '');
  const nextTier = Season.TIERS.find(t => t[1] > Season.data.xp);
  setText('sXp', Season.data.xp); setText('sDays', cur.daysLeft);
  setText('sNext', nextTier ? nextTier[1] - Season.data.xp : '★'); setText('sNextL', nextTier ? T('sNextTier', T('tier:' + nextTier[0])) : T('sTop'));
  const claimed = Season.data.claimed.length;
  setText('seasonSummary', T('trackProgress', claimed, Season.STEPS));
  const track = $('seasonTrack'); if (!track) return;
  const can = Season.claimable();
  track.innerHTML = Array.from({ length: Season.STEPS }, (_, i) => {
    const k = i + 1, need = Season.stepNeed(k), done = Season.data.claimed.includes(k), ready = can.includes(k);
    return `<div class="step ${done ? 'done' : ready ? 'ready' : ''}"><b>${k}</b>${done ? T('stepOpen') : ready ? `<button type="button" data-step="${k}">${T('box')}</button>` : `<i>${T('box')}</i>${T('stepNeed', need)}`}</div>`;
  }).join('');
  for (const b of track.querySelectorAll('button')) b.addEventListener('click', () => openBox(+b.dataset.step));
  setHidden('boxArea', true);
  function openBox(step) {
    const cards = Season.openBox(), area = $('boxCards');
    setHidden('boxArea', false); setText('boxText', T('boxPick'));
    area.innerHTML = cards.map((c, i) => `<button type="button" class="cardBtn" data-i="${i}">?</button>`).join('');
    let picked = false;
    for (const b of area.querySelectorAll('button')) b.addEventListener('click', () => {
      if (picked) return; picked = true;
      const card = Season.claim(step, cards[+b.dataset.i]); if (!card) return;
      if (card.type === 'xp') { Progress.data.xp += card.value; Progress.save(); }
      area.querySelectorAll('button').forEach((x, i) => { x.classList.add('open'); x.textContent = Season.rewardName(cards[i]); if (x === b) x.classList.add('pick'); });
      setText('boxText', T('boxWon', Season.rewardName(card), card.type));
      Sfx.levelUp();
      refreshMenu(); renderSeasonTrackOnly();
    });
  }
  function renderSeasonTrackOnly() {
    const can2 = Season.claimable();
    track.querySelectorAll('.step').forEach((el, i) => { const k = i + 1; if (Season.data.claimed.includes(k)) { el.className = 'step done'; el.innerHTML = `<b>${k}</b>${T('stepOpen')}`; } else if (can2.includes(k)) el.className = 'step ready'; });
    for (const b of track.querySelectorAll('button')) b.addEventListener('click', () => openBox(+b.dataset.step));
  }
}
if ($('seasonBtn')) $('seasonBtn').addEventListener('click', () => { renderSeason(); $('seasonModal').hidden = false; });
if ($('seasonCloseBtn')) $('seasonCloseBtn').addEventListener('click', () => { $('seasonModal').hidden = true; });

// Yarım kalan: en yakın bitmemiş hedef, tur sonu ekranında tek satır (bitmemiş iş akılda kalır)
function nearestGoal() {
  if (!useProgress) return '';
  const c = [];
  const m = Progress.todayMission();
  if (m && !m.done) c.push({ r: m.progress / m.target, text: T('goalMission', m.target - m.progress, missionText(m)) });
  const li = Progress.levelInfo();
  c.push({ r: li.into / li.need, text: T('goalLevel', li.level + 1, li.need - li.into) });
  const n = Nemesis.get();
  if (n) c.push({ r: 0.55, text: T('goalNemesis', n.name) });
  const sd = Streak.data;
  if (sd.days < Streak.TRAIL_DAYS) c.push({ r: sd.days / Streak.TRAIL_DAYS, text: T('goalStreak', Streak.TRAIL_DAYS - sd.days) });
  if (stats.best && stats.best > 1) c.push({ r: 0.45, text: T('goalBest', stats.best) });
  c.sort((a, b) => b.r - a.r);
  return c.length ? T('goalPrefix', c[0].text) : '';
}

// Görünüm seçici. Kilitli görünümler de gezilir (vitrin); oyun son seçilen açık görünümle başlar.

function drawSkinPreview() {
  const c = $('skinPreview'), g = c.getContext('2d'), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const locked = skinLocked(skinIdx);
  const fake = GAME.previewActor(KUMUL_SKINS[skinIdx].colors, W, H);
  const ctx0 = renderer.ctx, zoom0 = renderer.zoom;
  renderer.ctx = g; renderer.zoom = 1;
  g.globalAlpha = locked ? 0.45 : 1;
  renderer.drawSnake(fake, false);
  g.globalAlpha = 1;
  renderer.ctx = ctx0; renderer.zoom = zoom0;
  const sk = KUMUL_SKINS[skinIdx], m = useProgress ? Progress.masteryOf(skinIdx) : 0;
  setText('skinName', skinName(sk) + (m ? ' ' + '★'.repeat(m) : ''));
  const nextM = useProgress ? Progress.MASTERY[m] : null;
  setText('skinLock', locked ? (sk.ach ? T('lockAch') : T('lockLevel', sk.level)) : nextM ? T('mastery', Progress.skinRounds(skinIdx), nextM) : T('masterSkin'));
  setHidden('unlockBtn', !locked || !!sk.ach);                 // başarım görünümü reklamla açılmaz
}
function changeSkin(d) {
  skinIdx = (skinIdx + d + KUMUL_SKINS.length) % KUMUL_SKINS.length;
  while (KUMUL_SKINS[skinIdx].ach && !useDefter) skinIdx = (skinIdx + d + KUMUL_SKINS.length) % KUMUL_SKINS.length;   // defteri olmayan oyunda gösterilmez
  if (!skinLocked(skinIdx)) { savedSkin = skinIdx; store.set(GAME.key + '-skin', savedSkin); }
  drawSkinPreview();
}
$('skinPrev').addEventListener('click', () => changeSkin(-1));
$('skinNext').addEventListener('click', () => changeSkin(1));
if ($('unlockBtn')) $('unlockBtn').addEventListener('click', async () => {

  if (!ok) return;
  Progress.unlockSkin(skinIdx);
  savedSkin = skinIdx; store.set(GAME.key + '-skin', savedSkin);
  drawSkinPreview();
});

// ---------------------------------------------------------------------
// Girdi
//   Masaüstü: fare yön verir; tıklama ya da boşluk hızlandırır / atılır.
//   Dokunmatik: ekranın sol yarısı sanal joystick, sağ yarısı ve ekran düğmesi atılma.
// ---------------------------------------------------------------------
const input = { px: 0, py: 0, boost: false, dig: false, active: false };
const setPointer = e => { input.px = e.clientX; input.py = e.clientY; input.active = true; };
let pointerMoved = false;   // tur başında fare oynamadan böcek durur (yeni oyuncu boşta fırtınaya yürümesin)
canvas.addEventListener('mousemove', e => { setPointer(e); pointerMoved = true; if (touch.enabled && !touch.coarse) setTouchMode(false); });
canvas.addEventListener('mousedown', e => { setPointer(e); if (e.button === 2) input.dig = true; else input.boost = true; if (state === 'dead' && e.button === 0) pickSpectate(e.clientX, e.clientY); });
// Sonuç kartının dışına tıklama / dokunma da izlenen oyuncuyu değiştirir (kart tüm ekranı kaplar)
if ($('result')) $('result').addEventListener('mousedown', e => { if (e.target === $('result') && e.button === 0) pickSpectate(e.clientX, e.clientY); });
if ($('result')) $('result').addEventListener('touchstart', e => { const t = e.changedTouches[0]; if (e.target === $('result') && t) pickSpectate(t.clientX, t.clientY); }, { passive: true });
canvas.addEventListener('touchstart', e => { const t = e.changedTouches[0]; if (state === 'dead' && t) pickSpectate(t.clientX, t.clientY); }, { passive: true });
window.addEventListener('mouseup', e => { if (e.button === 2) input.dig = false; else input.boost = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());        // sağ tık = KAZI
const DIG_KEYS = new Set(['KeyX', 'ShiftLeft', 'ShiftRight']);
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { input.boost = true; e.preventDefault(); }
  if (DIG_KEYS.has(e.code)) input.dig = true;
});
window.addEventListener('keyup', e => { if (e.code === 'Space') input.boost = false; if (DIG_KEYS.has(e.code)) input.dig = false; });

// Sanal joystick. Boşta sol altta durur; parmak sol yarıda nereye basarsa taban oraya gelir,
// topuz parmağı izler. Yön = sapma açısı, itki = sapma miktarı. Bırakınca itki kesilir.
const STICK_R = 56, STICK_DEAD = 0.18;
const touch = {
  coarse: !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches),
  enabled: false,
  stick: { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0, r: STICK_R },
  used: false,                 // joystick en az bir kez kullanıldı mı (kullanılana kadar oyuncu durmaz)
  boostIds: new Set(),         // sağ yarıya basan parmaklar
  btnDown: false,              // ekran düğmesi basılı mı
};
const boostBtn = $('boostBtn'), digBtn = $('digBtn');
// Dokunmatik arayüzü duruma göre göster: atılma düğmesi yalnızca oynarken, ses düğmesi oynarken gizli
function syncTouchUi() {
  const playing = touch.enabled && state === 'playing';
  renderer.touchLayout = touch.enabled;
  boostBtn.hidden = !playing;
  if (digBtn) digBtn.hidden = !(playing && player && player.digEligible);   // KAZI düğmesi yalnızca hak varken (her karede tazelenir)
  setHidden('muteBtn', playing);
  setHidden('langBtn', state !== 'menu');                                   // dil düğmesi yalnız menüde
  document.body.classList.toggle('inMenu', state === 'menu');               // menüde ses düğmesi alt köşeye iner (mini harita yok)
}
function setTouchMode(on) { touch.enabled = on; syncTouchUi(); }
function syncBoost() { input.boost = touch.boostIds.size > 0 || touch.btnDown; }
if (digBtn) {
  digBtn.addEventListener('pointerdown', e => { input.dig = true; e.preventDefault(); });

  let url = params.get('ag') || GAME.online.url || '';   // ?ag=ws://localhost:8080 ile yerel sunucuya bağlanılır (geliştirme)
  if (!url) { try { const r = await fetch('/__net', { cache: 'no-store' }); if (r.ok) url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host; } catch {} }
  if (!url) return;
  onlineUrl = url; setHidden('onlineBtn', false); setHidden('roomsBtn', false);
  // Sunucu varsa büyük düğme çevrimiçi "Oyna", yerel tur "Botlarla pratik" olur (agar.io düzeni: Play = herkesle)
  const ob = $('onlineBtn'), pb = $('playBtn');
  if (ob && pb) { ob.dataset.t = 'play'; pb.dataset.t = 'practice'; pb.classList.add('ghost'); Lang.applyDom(); }
  if (urlRoom) { setText('onlineBtn', T('joinRoomBtn', urlRoom)); lastJoin = { code: urlRoom }; }
  wakeServer();
  pollOnlineCount(); pollLider();
}
// Menüde "● N oyuncu çevrimiçi" (sağlık ucu; 0 ise satır boş)
let onlineTimer = null;
async function pollOnlineCount() {
  clearTimeout(onlineTimer);
  if (!onlineUrl || GAME.online.url === '' && !location.host) return;
  try {
    const r = await fetch(onlineUrl.replace(/^ws/, 'http') + '/__net', { cache: 'no-store' });
    const j = await r.json(); setText('onlineCount', j.humans > 0 ? T('onlineNow', j.humans) : '');
  } catch { setText('onlineCount', ''); }
  onlineTimer = setTimeout(pollOnlineCount, state === 'menu' ? 10000 : 30000);
}
// Durum metni: menüde onlineLine, oyun içinde (ya da özel oda denetimleri gerekince) üstteki şerit
let waitTimer = null, waitInfo = null;   // bekleme kartı sayacı (sunucu 'wait'i bir kez gönderir)
function stopWaitTick() { clearInterval(waitTimer); waitTimer = null; waitInfo = null; }
let lastNetText = '', lastNetCtl = null;
function refreshNet() { netStatus(lastNetText, lastNetCtl); }   // kart açılıp kapanınca şerit/bekleme kartı yeniden değerlendirilir
function netStatus(text, ctl = null) {
  lastNetText = text || ''; lastNetCtl = ctl;
  const menuOpen = !$('menu').hidden;
  setText('onlineLine', ctl && menuOpen ? '' : (text || ''));   // özel oda denetimleri şeritte; menüde metni iki kez yazma
  setText('netText', text || '');
  // Tur bitti ve sonuç kartı kapalıysa (Yeni tur denmiş) eski sahnede küçük şerit yerine bekleme kartı; ev sahibi denetimleri şeritte kalır
  const waiting = !!text && !menuOpen && $('result').hidden && (state === 'dead' || state === 'over') && !(ctl && ctl.code);
  setText('waitText', text || ''); setHidden('waitCard', !waiting);
  setHidden('netBanner', !text || (menuOpen && !ctl) || waiting || (!$('result').hidden && !(ctl && ctl.code)));
  setHidden('copyRoomBtn', !(ctl && ctl.code));
  setHidden('leaveRoomBtn', !(ctl && ctl.code));
  if (ctl) { myRoomCode = ctl.code || null; if (myRoomCode && $('roomList') && !$('roomBox').hidden) renderRooms([]); }
  setHidden('beginBtn', !(ctl && ctl.canBegin));
  if (ctl && ctl.code) $('copyRoomBtn').dataset.code = ctl.code;
}
function wireNet(n) {
  const btn = $('onlineBtn');
  n.onLobby = m => { stopWaitTick();
    if (m.code) {
      const hint = m.wait !== null ? T('startingIn', m.wait) : m.host ? T('hostHint') : T('waitHost');
      netStatus(`${T('roomCode', m.code, m.ready, m.humans)} · ${hint}`, { code: m.code, canBegin: m.host && m.wait === null && m.ready > 0 });
    } else netStatus(m.wait === null ? T('roomIdle', m.humans) : T('matching', m.wait, m.humans));
  };
  n.onWait = m => {
    stopWaitTick(); waitInfo = { left: m.left, humans: m.humans, at: Date.now() };
    netStatus(T('waitRound', m.left, m.humans));
    waitTimer = setInterval(() => { if (!waitInfo) return; const left = Math.max(0, waitInfo.left - Math.round((Date.now() - waitInfo.at) / 1000)); netStatus(T('waitRound', left, waitInfo.humans)); }, 1000);
  };
  n.onStart = r => { stopWaitTick(); if (r.player) beginOnlineRound(r); else beginSpectate(r); };
  n.onRooms = list => renderRooms(list);
  n.onOver = () => { if (state !== 'playing') renderer.showStamp(net.round && net.round.winner ? T('roundWonBy', net.round.winner.name) : T('roundOver'), T('nextRound')); };   // izleyen/bekleyen: sahne donmadan önce büyük yazı
  n.onServerError = m => { netStatus(T('err:' + m.msg)); if (btn) btn.disabled = false; };
  n.onClose = () => { if (net !== n) return; if (onlineMode && (state === 'playing' || state === 'dead')) renderer.showToast(T('onlineLost')); onlineMode = false; netStatus(''); if (btn) btn.disabled = false; };
}
// Bağlantı yoksa kur; sunucu uyuyorsa birkaç kez dene (toplam ~45 sn)
async function ensureNet() {
  if (net && net.connected) return true;
  const btn = $('onlineBtn'); if (btn) btn.disabled = true;
  netStatus(T('connecting'));
  for (let deneme = 0; deneme < 4; deneme++) {
    const n = new NetClient(onlineUrl); wireNet(n);
    try { await n.connect(); net = n; return true; }
    catch { if (deneme < 3) { wakeServer(); netStatus(T('connecting')); await new Promise(r => setTimeout(r, 10000)); } }
  }
  netStatus(T('onlineFail')); if (btn) btn.disabled = false;
  return false;
}
// Ücretsiz barındırma boşta uyur (ilk istek 30–60 sn): menü açılır açılmaz sağlık ucuna dokunup uyandırırız.
function wakeServer() {
  if (!onlineUrl || GAME.online.url === '') return;
  try { fetch(onlineUrl.replace(/^ws/, 'http') + '/__net', { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); } catch {}
}
initOnline();
// opts: {} hızlı eşleşme (odadaysan orada kal) · {code} özel oda · {create:true} özel oda kur · {room:id} belirli açık oda
async function startOnline(opts = {}) {
  Sfx.init();
  const name = playerName(), btn = $('onlineBtn');
  if (!(await ensureNet())) return;
  if (btn) btn.disabled = true;
  lastJoin = opts.create ? {} : opts;      // kurulan odanın kodu lobby mesajıyla gelir; "Yeni tur" aynı odada kalır
  track('online_join', { how: opts.code ? 'code' : opts.create ? 'create' : opts.room ? 'room' : 'quick' });
  net.join({ name, pid, skin: savedSkin, stage: Tutor.stage(), chat: useStream && Twitch.queue.length ? Twitch.take(15) : null, ...opts });
}

function beginSpectate(r) {

  const skin = KUMUL_SKINS[savedSkin % KUMUL_SKINS.length];

  player.alive = false; player.place = 0; r.player = player;
  revived = true; awarded = 'spectate'; overShown = true; spectateId = null;   // diriliş yok, ilerleme yazılmaz, sonuç kartı üzerine yazılmaz

// Açık oda listesi (menüde "Odalar"): 4 sn'de bir tazelenir
let myRoomCode = null;   // kurulu özel oda (Odalar kutusunda gösterilir)
function renderRooms(list) {
  const box = $('roomList'); if (!box) return;
  box.textContent = '';
  if (!list.length) { const p = document.createElement('span'); p.className = 'small'; p.textContent = myRoomCode ? T('yourRoom', myRoomCode) : T('noRooms', T('play')); box.appendChild(p); return; }
  for (const r of list) {
    const row = document.createElement('div'); row.className = 'room';
    const s = document.createElement('span');
    s.textContent = `${T('roomRow', r.name, r.humans)} · ${r.state === 'lobby' ? T('roomLobby', r.wait) : r.state === 'playing' ? T('roomPlaying', r.left, r.dropin) : T('roomOver')}`;
    const b = document.createElement('button'); b.className = 'btn ghost mini'; b.textContent = T('join');
    b.addEventListener('click', () => startOnline({ room: r.id }));
    row.appendChild(s); row.appendChild(b); box.appendChild(row);
  }
}

// Sonucu istatistiğe ve ilerlemeye yaz. Aynı turda ikinci kez çağrılırsa (dirilişten sonra) yalnızca fark eklenir.
function recordResult() {
  if (!player) return null;
  const now = { place: round.placementOf(player), total: round.total, kills: player.kills || 0, powers: player.powersTaken || 0, revenge: !!player.revenge };
  if (awarded && awarded.place === now.place && awarded.kills === now.kills && awarded.powers === now.powers && awarded.revenge === now.revenge) return null;
  if (!awarded) stats.rounds++;
  if (now.place === 1 && !(awarded && awarded.place === 1)) stats.wins++;
  stats.best = stats.best === null ? now.place : Math.min(stats.best, now.place);
  store.set(GAME.key + '-stats', stats);
  const res = useProgress ? Progress.addRound(now, awarded) : null;
  if (res && useSeason) Season.addXp(res.gain);                 // sezon puanı tur puanıyla birlikte birikir
  if (res && !awarded) {                                        // görünüm ustalığı: tur başına bir kez
    const before = Progress.masteryOf(savedSkin), after = Progress.addSkinRound(savedSkin);
    if (after > before) res.newEntries = [T('masteryNew', skinName(KUMUL_SKINS[savedSkin]), '★'.repeat(after))];
  }
  // Defter ve başarımlar turun ilk sonucuyla işlenir (diriliş sonrası ikinci kez sayılmaz)
  if (res && useDefter && !awarded) {
    const info = { place: now.place, total: now.total, kills: now.kills, score: Math.round(player.score), steals: player.steals || 0, escapes: player.breaths || 0,
                   ballKills: player.ballKills || 0, launches: player.launches || 0, digs: player.digs || 0,
                   revenge: now.revenge, mutation: round.mutation, highlights: roundHighlights, level: res.after.level };
    const got = GAME.collection.onRound(info);
    res.newEntries = [...(res.newEntries || []), ...got.species.map(s => T('bookNew', GAME.collection.speciesName(s))), ...got.achievements.map(a => T('achNew', GAME.collection.achName(a), a.skin ? GAME.collection.skinLabel(a.skin) : ''))];
  }
  awarded = now;
  refreshMenu();
  drawSkinPreview();
  return res;
}

function showProgress(res) {
  if (!useProgress || !res) return;
  setHidden('xpBox', false);
  setText('xpGain', T('xpGain', res.gain));
  if ($('xpBar')) $('xpBar').style.width = Math.round(res.after.into / res.after.need * 100) + '%';
  const notes = [T('level', res.after.level)];
  if (res.leveledUp) notes[0] = T('levelUp', res.after.level);
  if (res.newSkins.length) notes.push(T('newSkins', res.newSkins.map(n => skinName({ name: n })).join(', ')));
  if (res.missionDone) notes.push(T('missionReward', Progress.MISSION_REWARD));
  setText('xpNote', notes.join(' · '));
  setText('newLine', res.newEntries && res.newEntries.length ? T('newPrefix', res.newEntries.join(' · ')) : '');
  if (res.leveledUp || (res.newEntries && res.newEntries.length)) Sfx.levelUp();
}

function showResult(title, sub, allowRevive) {
  $('resultTitle').textContent = title;
  $('resultSub').textContent = sub;
  $('statPlace').textContent = round.placementOf(player) + '.';
  $('statKills').textContent = player.kills || 0;
  $('statMass').textContent = Math.round(player.score);
  setText('highlightLine', lastHighlight ? T('highlightLine', lastHighlight.stamp, lastHighlight.sub) : '');
  setText('rankLine', onlineMode && round.rank && round.rank.day ? T('yourRank', round.rank.day, round.rank.week) : '');
  const place = round.placementOf(player);
  setText('roundCode', T('roundCode', round.code));
  setHidden('clipBtn', !(useClips && Clip.last));
  if (challengeRound && challenge && challenge.place) {
    const who = challenge.name || T('rival');
    setText('challengeResult', place < challenge.place ? T('beat', who, challenge.place, place) : place === challenge.place ? T('tie', who, place) : T('lost', who, challenge.place, place));
  } else setText('challengeResult', '');
  stats.results = (stats.results || 0) + 1;                       // "tekrar oyna" oranı: again / results
  store.set(GAME.key + '-stats', stats);
  track('round_end', { place, total: round.total, kills: player.kills || 0, mass: Math.round(player.score), dur: Math.round(round.time), win: place === 1, moment: lastHighlight ? lastHighlight.key : '', challenge: challengeRound, mut: round.mutation || '' });
  $('reviveBtn').hidden = !allowRevive;
  $('watchBtn').hidden = !(state === 'dead' && !round.over);   // tur sürüyorsa izlemeyi seç
  if (challengeRound && urlSeed !== null) { urlSeed = null; if (params.has('s')) history.replaceState(null, '', location.pathname); }   // meydan okuma tek tur: sonraki tur normal tohum
  $('result').hidden = false;
  syncTouchUi(); if (onlineMode) refreshNet();
  Perf.send();
}
// İzle: kart kapanır, sahne (tıkla → oyuncu değiştir) görünür; "Sonuç kartı" ile geri dönülür, tur bitince kart kendiliğinden döner

  $('result').hidden = on; setHidden('backBtn', !on); if (onlineMode) refreshNet();
  if (on) { const t = cameraTarget(); if (t && t !== player) renderer.showToast(T('watching', t.name)); track('watch'); }

}
$('watchBtn').addEventListener('click', () => setWatching(true));
$('backBtn').addEventListener('click', () => setWatching(false));
// showProgress ilerlemeyi yazdıktan sonra çağrılır: görev/seviye sayıları güncel olsun
function showNearestGoal() { setText('yarimLine', nearestGoal()); }

function onDeath() {
  if (round.over && round.winner === player) return onWin();   // herkes aynı anda elendi, en büyük sendin
  state = 'dead';
  if (renderer.streamer) {
    renderer.pushFeed(`${player.killer ? player.killer.name + ' → ' : ''}${player.name}`);
    if (player.killer && player.killer.chatter) { stats.chatWins = (stats.chatWins || 0) + 1; store.set(GAME.key + '-stats', stats); streamScore(); }
  }
  if (useClips) Clip.flush();
  if (useProgress && player.killer && player.killer.brain) { Nemesis.record(player.killer); refreshMenu(); }
  Ads.gameplayStop();
  Sfx.lose();
  // Diriliş teklifi: tur başına bir kez, arena hâlâ genişken ve yalnız ilk GAME.reviveTop içinde (her ölümde teklif portal kurallarına aykırı)
  const place = round.placementOf(player);
  showResult(T('died', place), GAME.deathText(player), !revived && round.canRevive() && (place <= (GAME.reviveTop || 99) || (stats.rounds || 0) < 5));
  showProgress(recordResult());
  showNearestGoal();
}

function onWin() {
  if (GAME.highlights) { const h = GAME.highlights.onWin(round, player); if (h) { lastHighlight = h; roundHighlights.add(h.key); renderer.showStamp(h.stamp, h.sub); if (useClips) Clip.mark(h, round.code, true); } }
  if (useClips) Clip.flush();
  if (renderer.streamer) { stats.streamerWins = (stats.streamerWins || 0) + 1; store.set(GAME.key + '-stats', stats); streamScore(); }
  state = 'over';
  Ads.gameplayStop(); Ads.happy();
  Sfx.win();
  showResult(GAME.winTitle, GAME.winText(round.total), false);
  showProgress(recordResult());
  showNearestGoal();
}

// Klip: vurgu anının 9:16 videosu. Düğme yalnızca bir an yakalandıysa görünür.
let clipFile = null;
async function makeClip() {
  if (!useClips || !Clip.last) return;
  const modal = $('clipModal'); if (!modal) return;
  modal.hidden = false; clipFile = null;
  setHidden('clipShareBtn', true); setText('clipStatus', T('clipPrep', 0));
  const bar = $('clipBar'), setBar = p => { if (bar) { bar.style.width = Math.round(p * 100) + '%'; bar.parentElement.classList.toggle('done', p >= 1); } };
  setBar(0);
  try {
    const { blob, ext } = await Clip.export(Clip.last, $('clipCanvas'), GAME.Renderer, GAME.title || T('game'), p => { setText('clipStatus', T('clipPrep', Math.round(p * 100))); setBar(p); });
    setBar(1);
    const slug = Clip.last.stamp.toLowerCase().replace(/[çğıöşüi̇]/g, c => ({ 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'i̇': 'i' })[c] || c).replace(/[^a-z]/g, '');
    clipFile = new File([blob], `${(GAME.key || 'klip')}-${Clip.last.code}-${slug}.${ext}`, { type: blob.type });
    const canShare = navigator.canShare && navigator.canShare({ files: [clipFile] });
    setText('clipStatus', T('clipReady', Clip.last.stamp, (blob.size / 1024).toFixed(0)));
    setText('clipShareBtn', T(canShare ? 'share' : 'download'));
    setHidden('clipShareBtn', false);
    stats.clips = (stats.clips || 0) + 1; store.set(GAME.key + '-stats', stats); track('clip', { moment: Clip.last.key || Clip.last.stamp, kb: Math.round(blob.size / 1024) });
  } catch (e) { setText('clipStatus', T('clipFail', e && e.message ? e.message : e)); }
}
async function shareClip() {
  if (!clipFile) return;
  stats.clipShares = (stats.clipShares || 0) + 1; store.set(GAME.key + '-stats', stats); track('clip_share');
  if (navigator.canShare && navigator.canShare({ files: [clipFile] })) {
    try { await navigator.share({ files: [clipFile], text: shareText().text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(clipFile); a.download = clipFile.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
if ($('clipBtn')) $('clipBtn').addEventListener('click', makeClip);
if ($('clipShareBtn')) $('clipShareBtn').addEventListener('click', shareClip);
if ($('clipCloseBtn')) $('clipCloseBtn').addEventListener('click', () => { $('clipModal').hidden = true; });
function detectHighlight() {
  if (!GAME.highlights) return;
  const h = GAME.highlights.step(round, player);
  if (h && state === 'playing') showHighlight(h);
}

// Bir sabit adım
function tick(dt) {
  if (state === 'playing') {
    applyInput();
    if (onlineMode) net.tick(); else round.step(dt);
    if (useClips) Clip.tick(round.world);
    Tutor.tick();
    stormWatch(dt);
    detectHighlight();
    handleEvents();
    if (!player.alive) onDeath();
    else if (round.over) onWin();
  } else if (state === 'dead') {
    if (onlineMode) net.tick(); else round.step(dt);
    if (GAME.highlights) GAME.highlights.step(round, null);     // final üçlüsü kaydı tutulsun
    handleEvents();
    if (round.over && !overShown) onRoundOverWhileDead();
  } else if (state === 'menu') {
    round.step(dt);
    if (round.over && (attractTimer += dt) > 2) { round = new Round(); attractTimer = 0; }
  }
}

// İzlenecek oyuncu: sen, yoksa seni eleyen, yoksa en büyük
// Elendikten sonra izlenen oyuncu: tıklanan böcek (yakınsa) ya da tıkla → sıradaki canlı; seçim yoksa seni eleyen, o da yoksa en büyük
let spectateId = null;
function pickSpectate(cx, cy) {
  if (state !== 'dead' || !round || !round.world) return;
  const alive = round.world.snakes.filter(s => s.alive && s !== player).sort((a, b) => b.mass - a.mass);
  if (!alive.length) return;
  const w = renderer.screenToWorld(cx, cy);
  let hit = null, best = Infinity;
  for (const s of alive) { const d = Math.hypot(s.x - w.x, s.y - w.y); if (d < s.radius + 60 && d < best) { best = d; hit = s; } }
  if (!hit) { const cur = cameraTarget(), i = alive.indexOf(cur); hit = alive[(i + 1) % alive.length]; }   // boşa tıklama: sıradaki
  spectateId = hit.id;
  renderer.showToast(T('watching', hit.name));
}
function cameraTarget() {
  if (player && player.alive && state !== 'menu') return player;
  if (state === 'dead' && spectateId !== null) { const s = round.world.snakes.find(x => x.id === spectateId); if (s && s.alive) return s; spectateId = null; }
  if (state === 'dead' && player.killer && player.killer.alive) return player.killer;
  let best = null;
  for (const s of round.world.snakes) if (s.alive && (!best || s.mass > best.mass)) best = s;
  return best || round.winner;
}

const DT = 1 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  Perf.frame(now - last);
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  const slow = slowmo > 0 && state === 'playing';
  if (slowmo > 0) slowmo -= real;
  if (!paused && !adPlaying) acc += real * (slow ? SLOWMO.scale : 1);   // duraklatma ve reklamda simülasyon ilerlemez
  while (acc >= DT) { tick(DT); acc -= DT; }
  const target = cameraTarget();
  renderer.zoomBoost += ((slow ? SLOWMO.zoom : 1) - renderer.zoomBoost) * Math.min(1, real * 6);
  renderer.updateCamera(target, real);
  renderer.stick = touch.enabled && state === 'playing' ? stickView() : null;
  renderer.draw(round.world, state === 'menu' ? null : player, state === 'menu' ? null : round, state === 'dead' ? target : null);   // menüde HUD çizilmez (lobi temiz)
  if (Perf.show) Perf.draw(renderer.ctx, renderer.dpr);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
