<style>
  :root {
    --sand: #e8d5a9; --paper: #fdf9ee; --ink: #2a1f14; --muted: #7a6548;
    --teal: #0e7c7b; --teal-deep: #095857; --storm: #b5532e; --amber: #f2a104;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sand); color: var(--ink);
               font-family: 'Rubik', system-ui, sans-serif; }
  canvas#game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 16px; padding: 20px; box-sizing: border-box; }
  .overlay[hidden] { display: none; }
  #menu { background: rgba(232, 213, 169, 0.74); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  #result { background: rgba(232, 213, 169, 0.45); }

  .logo { font-family: 'Rammetto One', 'Rubik', system-ui, sans-serif; font-weight: 400; margin: 0; line-height: 0.95;
          font-size: clamp(56px, 13vw, 124px); letter-spacing: 0.03em; color: var(--ink); text-shadow: 4px 5px 0 var(--amber); }
  .tagline { margin: 0; font-weight: 500; font-size: 16px; color: var(--ink); text-align: center; text-wrap: balance; }

  .field, .btn, .arrow { font-family: inherit; box-sizing: border-box; border-radius: 10px; border: 2px solid var(--ink); }
  .field { width: 240px; padding: 11px 14px; font-size: 16px; text-align: center; background: var(--paper); color: var(--ink); }
  .field::placeholder { color: var(--muted); }
  .btn { padding: 12px 30px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--teal); color: var(--paper);
         box-shadow: 0 4px 0 var(--teal-deep); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--teal-deep); }
  .btn.ghost { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 rgba(42, 31, 20, 0.25); }
  .btn[hidden] { display: none; }
  .field:focus-visible, .btn:focus-visible, .arrow:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  #skinPick { display: flex; align-items: center; gap: 10px; }
  #skinPick canvas { display: block; width: 220px; height: 56px; }
  #skinName { text-align: center; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .arrow { width: 40px; height: 40px; background: var(--paper); color: var(--ink); font-size: 15px; cursor: pointer; }
  .arrow:active { transform: translateY(2px); }

  .small { margin: 0; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; max-width: 44ch; }

  .card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 24px 28px;
          box-shadow: 6px 8px 0 rgba(42, 31, 20, 0.2); display: flex; flex-direction: column; align-items: center; gap: 14px;
          min-width: min(320px, 86vw); }
  .card h2 { font-family: 'Rammetto One', 'Rubik', system-ui, sans-serif; font-weight: 400; font-size: 32px; margin: 0;
             text-align: center; text-wrap: balance; }
  .statRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
  .statRow div { text-align: center; }
  .statRow b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .statRow span { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #boostBtn { position: fixed; right: 18px; bottom: 22px; width: 84px; height: 84px; border-radius: 50%;
              border: 2px solid var(--ink); background: rgba(253, 249, 238, 0.85); color: var(--ink);
              font-family: inherit; font-weight: 700; font-size: 13px; touch-action: none; user-select: none; }
  #boostBtn[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="boostBtn" hidden>HIZLAN</button>

<div id="menu" class="overlay">
  <h1 class="logo">KUMUL</h1>
  <p class="tagline">Fırtına daralıyor. Son yılan sen ol.</p>
  <input id="nameInput" class="field" placeholder="Takma ad" maxlength="12" autocomplete="off">
  <div id="skinPick">
    <button id="skinPrev" class="arrow" aria-label="Önceki görünüm">◀</button>
    <div><canvas id="skinPreview" width="220" height="56"></canvas><div id="skinName"></div></div>
    <button id="skinNext" class="arrow" aria-label="Sonraki görünüm">▶</button>
  </div>
  <button id="playBtn" class="btn">Oyna</button>
  <p id="statsLine" class="small"></p>
  <p class="small">Fare ya da parmak yön verir. Basılı tutmak veya boşluk tuşu hızlandırır.<br>
     Yerdeki güçleri topla: kalkan, mıknatıs, turbo.</p>
</div>

<div id="result" class="overlay" hidden>
  <div class="card">
    <h2 id="resultTitle"></h2>
    <p id="resultSub" class="small"></p>
    <div class="statRow">
      <div><b id="statPlace"></b><span>Sıra</span></div>
      <div><b id="statKills"></b><span>Av</span></div>
      <div><b id="statMass"></b><span>Uzunluk</span></div>
    </div>
    <div class="actions">
      <button id="reviveBtn" class="btn ghost">Bir kez diril</button>
      <button id="againBtn" class="btn">Yeni tur</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
// agent.js — Yapay zeka ajanının beyni
// Bu dosya motorun iç yapısını BİLMEZ. Sadece algı paketi alır,
// eylem paketi döndürür.
// =====================================================================

// ---------------------------------------------------------------------
// 1) SÖZLEŞME: Algı paketi (motor -> ajan), her karede gelir
// ---------------------------------------------------------------------
// perception = {
//   self: {
//     x, y,          // kafa konumu
//     angle,         // gidiş yönü (radyan)
//     mass,          // kütle (büyüklük ölçüsü)
//     boosting,      // şu an boost basılı mı
//     speed,         // birim / saniye
//   },
//   foods: [ { x, y, value }, ... ],            // görüş içindeki yemler
//   snakes: [                                   // görüş içindeki DİĞER yılanlar
//     {
//       id,
//       mass,
//       head: { x, y, angle, speed },
//       segments: [ { x, y }, ... ],            // görüş içine giren gövde parçaları
//     }, ...
//   ],
//   walls: { left, right, top, bottom },        // dört duvara uzaklık (birim)
//   visionRadius,                               // görüş yarıçapı
// }

// ---------------------------------------------------------------------
// 2) SÖZLEŞME: Eylem paketi (ajan -> motor)
// ---------------------------------------------------------------------
// action = {
//   targetAngle,   // gitmek istediği yön (radyan). Motor dönüş hızını sınırlar.
//   boost,         // true / false
//   debug,         // isteğe bağlı: { state, targetX, targetY } — ekranda göstermek için
// }

// ---------------------------------------------------------------------
// 3) DURUMLAR
// ---------------------------------------------------------------------
const STATE = {
  COLLECT: 'COLLECT',  // TOPLA
  FLEE:    'FLEE',     // KAÇ
  HUNT:    'HUNT',     // AVLA
};

// ---------------------------------------------------------------------
// 4) AJAN
// ---------------------------------------------------------------------
class Agent {
  constructor(config = {}) {
    this.state = STATE.COLLECT;
    this.config = {
      dangerEnter:    80,   // tehdit bu mesafeden yakınsa KAÇ'a GİR
      dangerExit:     130,  // tehdit bu mesafeden uzaklaşınca KAÇ'tan ÇIK (histerezis)
      huntRatio:      0.6,  // rakip kütlesi / benim kütlem < bu ise AVLA
      wallMargin:     120,  // duvara bu kadar yaklaşınca tehlike say
      // --- yön puanlama ---
      numDirections:  16,   // aday yön sayısı
      lookAhead:      60,   // her yönü bu kadar ileride "sonda" ile test et
      vetoDistance:   35,   // sonda bir tehdide bundan yakınsa yön VETO
      dangerWeight:   2.0,  // orta mesafe tehdit cezası ağırlığı
      dangerRange:    220,  // sonda bir tehdide bundan uzaksa ceza yok
      goalWeight:     1.0,  // hedefe yönelme ödülü ağırlığı
      keepHeading:    0.15, // mevcut yönü koruma ödülü (titremeyi azaltır)
      unreachableDist: 90,  // bu mesafeden yakın ve arkada kalan yem hedef alınmaz (halka önleyici)
      // --- boost ---
      boostMinMass:   30,   // bu kütlenin altında asla boost yapma
      boostFleeDist:  60,   // KAÇ: tehdit bundan yakınsa boost
      boostHuntDist:  150,  // AVLA: av bundan yakınsa boost
      // --- zorluk (ajanı kasıtlı olarak kusurlu yapar) ---
      noise:          0,    // seçilen açıya eklenen rastgele sapma (radyan). 0 = mükemmel
      ...config,
    };
  }

  // Her karede motor bunu çağırır.
  decide(perception) {
    const threat = this.senseThreat(perception);   // ALGILA
    this.state   = this.transition(perception, threat); // DURUM GÜNCELLE
    return this.act(perception, threat);            // EYLEM ÜRET
  }

  // Benden belirgin küçük yılan "av"dır: gövdesi tehdit sayılmaz, sadece kafası.
  isPrey(p, snake) { return snake.mass < p.self.mass * this.config.huntRatio; }

  // -------------------------------------------------------------------
  // ALGILA: Görüş içindeki en yakın tehdidi bul.
  // Tehdit = başka bir yılanın gövde parçası veya kafası.
  // Kütle muafiyeti: avın gövdesi tehdit değildir (yoksa avcı ava yaklaşamaz;
  // laboratuvarda kanıtlandı: 120 sn'de toplam 0.7 av).
  // Duvar ayrı ele alınır; yön puanlamada cezalandırılır.
  // -------------------------------------------------------------------
  senseThreat(p) {
    let nearest = null;
    let nearestDist = Infinity;
    for (const snake of p.snakes) {
      const points = this.isPrey(p, snake) ? [snake.head] : [snake.head, ...snake.segments];
      for (const pt of points) {
        const d = Math.hypot(pt.x - p.self.x, pt.y - p.self.y);
        if (d < nearestDist) {
          nearestDist = d;
          nearest = { x: pt.x, y: pt.y, dist: d, snakeId: snake.id };
        }
      }
    }
    return nearest; // null ise görüşte yılan yok
  }

  // -------------------------------------------------------------------
  // DURUM GÜNCELLE: Öncelik sırası KAÇ > AVLA > TOPLA
  // Histerezis: KAÇ'a 80'de gir, 130'a çıkana kadar KAÇ'ta kal.
  // -------------------------------------------------------------------
  transition(p, threat) {
    const c = this.config;
    const minWall = Math.min(p.walls.left, p.walls.right, p.walls.top, p.walls.bottom);

    // Kural 1: tehdit yakın mı? (histerezisli eşik)
    const threshold = this.state === STATE.FLEE ? c.dangerExit : c.dangerEnter;
    const threatNear = threat !== null && threat.dist < threshold;
    const wallNear   = minWall < c.wallMargin;
    if (threatNear || wallNear) return STATE.FLEE;

    // Kural 2: avlanabilir rakip var mı?
    if (this.findPrey(p)) return STATE.HUNT;

    // Kural 3: varsayılan
    return STATE.COLLECT;
  }

  // Görüşteki, oran eşiğinin altındaki EN KÜÇÜK rakibi döndür.
  findPrey(p) {
    let best = null;
    for (const s of p.snakes) {
      if (s.mass < p.self.mass * this.config.huntRatio) {
        if (!best || s.mass < best.mass) best = s;
      }
    }
    return best;
  }

  // -------------------------------------------------------------------
  // EYLEM ÜRET
  // 1) Duruma göre hedef nokta seç (KAÇ'ta hedef yok)
  // 2) 16 aday yönü katmanlı puanla, en iyisini seç
  // 3) Boost politikasını uygula
  // -------------------------------------------------------------------
  act(p, threat) {
    const target = this.pickTarget(p);
    let targetAngle = this.scoreDirections(p, target);
    if (this.config.noise > 0) targetAngle += (Math.random() - 0.5) * 2 * this.config.noise;
    targetAngle = this.commitTurn(p, targetAngle);
    const boost = this.shouldBoost(p, threat, target);
    return {
      targetAngle,
      boost,
      debug: { state: this.state, targetX: target?.x, targetY: target?.y },
    };
  }

  // U dönüşü kararlılığı. Hedef neredeyse tam arkadaysa "sağdan mı soldan mı" kararı her
  // düşünmede değişebilir (gürültü veya eşit puanlı iki yön). Yılan bir sağa bir sola kıpırdar,
  // dönemez ve dümdüz gider. Ölçüm: daralan arenada ölümlerin %80'i böyle duvara girmekti.
  // Çözüm: bir dönüş yönü seç, hedef öne gelene kadar ona bağlı kal.
  commitTurn(p, targetAngle) {
    const diff = Math.atan2(Math.sin(targetAngle - p.self.angle), Math.cos(targetAngle - p.self.angle));
    if (Math.abs(diff) < 2.0) { this.turnSide = 0; return targetAngle; }
    if (!this.turnSide) {
      // Dönüş yayı tehlikeden geçmesin: sağ ve sol 90 derecenin hangisi daha açıksa o taraftan dön
      const pts = this.threatPoints(p);
      const left = this.probe(p, p.self.angle - Math.PI / 2, pts).clear;
      const right = this.probe(p, p.self.angle + Math.PI / 2, pts).clear;
      this.turnSide = Math.abs(left - right) > 10 ? (right > left ? 1 : -1) : (diff >= 0 ? 1 : -1);
    }
    return p.self.angle + this.turnSide * 2.0;
  }

  // Duruma göre hedef: TOPLA -> en iyi yem, AVLA -> avın önü, KAÇ -> yok
  pickTarget(p) {
    if (this.state === STATE.COLLECT) {
      let best = null, bestScore = -Infinity;
      for (const f of p.foods) {
        const d = Math.hypot(f.x - p.self.x, f.y - p.self.y);
        // Dönüş maliyeti: yem arkada ve yakınsa dönüş yarıçapı yüzünden ulaşılamaz,
        // ajan onun etrafında halka çizer (laboratuvarda kanıtlandı: 60 halka -> 2 halka).
        const ang  = Math.atan2(f.y - p.self.y, f.x - p.self.x);
        const turn = Math.abs(Math.atan2(Math.sin(ang - p.self.angle), Math.cos(ang - p.self.angle)));
        if (d < this.config.unreachableDist && turn > Math.PI / 2) continue;
        const score = f.value / (d + 10) * (0.5 + 0.5 * Math.cos(turn));   // yakın, değerli ve önde olan kazanır
        if (score > bestScore) { bestScore = score; best = f; }
      }
      return best;
    }
    if (this.state === STATE.HUNT) {
      const prey = this.findPrey(p);
      if (!prey) return null;
      return this.interceptPoint(p, prey);
    }
    return null; // FLEE
  }

  // Öncülleme: avın hızını ve kendi hızımı kullanıp gerçek buluşma noktasını hesapla.
  // |P + V·t − M| = s·t denklemini t için çöz (ikinci derece), en küçük pozitif kökü al.
  interceptPoint(p, prey) {
    const h = prey.head;
    const vx = Math.cos(h.angle) * h.speed, vy = Math.sin(h.angle) * h.speed;   // av hızı
    const dx = h.x - p.self.x, dy = h.y - p.self.y;                             // bana göre konum
    const s  = p.self.speed;
    const a = vx * vx + vy * vy - s * s;
    const b = 2 * (dx * vx + dy * vy);
    const c = dx * dx + dy * dy;
    let t = null;
    if (Math.abs(a) < 1e-6) { if (Math.abs(b) > 1e-6) t = -c / b; }
    else {
      const disc = b * b - 4 * a * c;
      if (disc >= 0) {
        const r = Math.sqrt(disc), t1 = (-b - r) / (2 * a), t2 = (-b + r) / (2 * a);
        t = Math.min(...[t1, t2].filter(v => v > 0));
        if (!isFinite(t)) t = null;
      }
    }
    if (t === null || t > 3) {                                  // çözüm yoksa/uzaksa: sabit önde
      const lead = 80;
      return { x: h.x + Math.cos(h.angle) * lead, y: h.y + Math.sin(h.angle) * lead };
    }
    return { x: h.x + vx * t, y: h.y + vy * t };
  }

  // Görüşteki yılan noktaları. Av gövdesi: sadece VETO (çarpmak yine öldürür), ceza yok.
  threatPoints(p) {
    const pts = [];
    for (const s of p.snakes) {
      const prey = this.isPrey(p, s);
      pts.push({ x: s.head.x, y: s.head.y, prey: false });
      for (const seg of s.segments) pts.push({ x: seg.x, y: seg.y, prey });
    }
    return pts;
  }

  // Bir yöne lookAhead kadar gidilse: en yakın yılan noktası, en yakın "gerçek tehdit" ve duvar payı
  probe(p, angle, pts) {
    const c = this.config;
    const dx = Math.cos(angle) * c.lookAhead, dy = Math.sin(angle) * c.lookAhead;
    const px = p.self.x + dx, py = p.self.y + dy;
    let nearAny = Infinity, nearThreat = Infinity;
    for (const t of pts) {
      const d = Math.hypot(t.x - px, t.y - py);
      if (d < nearAny) nearAny = d;
      if (!t.prey && d < nearThreat) nearThreat = d;
    }
    const wall = Math.min(p.walls.left + dx, p.walls.right - dx, p.walls.top + dy, p.walls.bottom - dy);
    return { nearAny, nearThreat, wall, clear: Math.min(nearAny, wall) };
  }

  // Katmanlı puanlama: VETO (çok yakın) + ceza (orta) + hedef ödülü
  //
  // Ölçümle düzeltilen kusur: eski sürüm her gövde parçası için ayrı ceza topluyordu.
  // 50 parçalı bir yılan 300 birim öteden, 60 birimdeki ölümcül duvardan daha güçlü itiyor,
  // ajanı duvara sürüyordu (daralan arenada ölümlerin %80'i). Şimdi:
  //   - yılan cezası yalnızca EN YAKIN tehdit noktasından ve dangerRange içinde,
  //   - duvar cezası yaklaştıkça sertleşiyor (1/mesafe), yani yakın duvar uzak yılanı yener,
  //   - bütün yönler vetoluysa en açık yön seçilir (eskiden düz devam edip ölüyordu).
  scoreDirections(p, target) {
    const c = this.config;
    const pts = this.threatPoints(p);

    let bestAngle = p.self.angle, bestScore = -Infinity;
    let fallbackAngle = p.self.angle, fallbackClear = -Infinity;

    for (let i = 0; i < c.numDirections; i++) {
      const angle = (i / c.numDirections) * Math.PI * 2;
      const pr = this.probe(p, angle, pts);

      // Katman 1: VETO
      if (pr.clear < c.vetoDistance) {
        if (pr.clear > fallbackClear) { fallbackClear = pr.clear; fallbackAngle = angle; }
        continue;
      }

      // Katman 2: orta mesafe cezaları
      let score = 0;
      if (pr.nearThreat < c.dangerRange) score -= c.dangerWeight * (c.vetoDistance / pr.nearThreat);
      if (pr.wall < c.wallMargin) score -= c.dangerWeight * (c.wallMargin / pr.wall - 1);

      // Katman 3: hedefe yönelme ödülü (cos: aynı yön=+1, ters=-1)
      if (target) {
        const toTarget = Math.atan2(target.y - p.self.y, target.x - p.self.x);
        score += c.goalWeight * Math.cos(angle - toTarget);
      }

      // Mevcut yönü koruma ödülü
      score += c.keepHeading * Math.cos(angle - p.self.angle);

      if (score > bestScore) { bestScore = score; bestAngle = angle; }
    }
    return bestScore === -Infinity ? fallbackAngle : bestAngle;
  }

  // Boost: KAÇ ve AVLA'da, kütle alt sınırının üstündeyken
  shouldBoost(p, threat, target) {
    const c = this.config;
    if (p.self.mass < c.boostMinMass) return false;
    if (this.state === STATE.FLEE) return threat !== null && threat.dist < c.boostFleeDist;
    if (this.state === STATE.HUNT && target) {
      return Math.hypot(target.x - p.self.x, target.y - p.self.y) < c.boostHuntDist;
    }
    return false;
  }
}

// Zorluk: botların tepki süresi, hızı ve hatası. Ajan mantığı değişmez.
const DIFFICULTY = {
  // massCap: bot bu kütleyi geçince patlar, yeme dönüşür ve küçük doğar (uzun süren sunucuda dev bot birikmesin)
  // lab, kolay, 180 sn: tavansız ort. 271 / en büyük 2389; 400 tavan -> ort. 181, 33 patlama; 300 -> ort. 154, 70 patlama
  kolay:  { decisionInterval: 8, speedFactor: 0.80, noise: 0.35, huntRatioScale: 0.7,  massCap: 400 },
  normal: { decisionInterval: 5, speedFactor: 0.92, noise: 0.15, huntRatioScale: 0.9,  massCap: 600 },
  zor:    { decisionInterval: 3, speedFactor: 1.00, noise: 0.00, huntRatioScale: 0.75, massCap: Infinity },  // lab: 1.0 -> 50 ölüm, 0.75 -> 28, 0.7 -> 2 (keskin eşik)
};

</script>
<script>
// =====================================================================
// engine.js — Oyun motoru
// Dünyayı ilerletir, çarpışmaları bulur, her ajana algı paketi üretir.
// Ajanların NASIL karar verdiğini bilmez; sadece decide() çağırır.
// =====================================================================

const WORLD = {
  // Ölçek: bir ekran yaklaşık 1300 birim. 1400 kenarlı harita 1.1 ekrandı, çok dardı.
  // 5000 kenar yaklaşık 4 ekran eder; 12 bot ile ekran başına ~0.8 yılan (eski halde 4).
  width: 5000, height: 5000,
  foodCount: 1600,          // haritada sürekli tutulacak doğal yem (ekran başına ~60)
  maxFoods: 2200,           // ziyafet yemleri dahil üst sınır; aşınca en eski yem silinir (yem patlamasını keser)
  visionRadius: 450,
  baseSpeed: 150,           // birim / saniye
  boostSpeed: 300,
  turnSpeed: 4.0,           // radyan / saniye
  boostCost: 6,             // saniyede kaybedilen kütle
  minBoostMass: 12,         // bu kütlenin altında boost kapanır
  startMass: 20,
  segmentSpacing: 5,        // iz noktaları arası hedef mesafe
  decisionInterval: 3,      // ajan her N karede bir düşünür
  respawnDelay: 2.0,        // saniye
  spawnProtection: 4.0,     // yeni doğan yılan bu kadar saniye görünmez ve dokunulmaz (sunucuda dev botlara yem olmasın)
};

// Kütle -> yarıçap. Çizim ve ağ istemcisi de kullanır.
function massToRadius(mass) { return 5 + Math.sqrt(mass) * 0.7; }

// ---------------------------------------------------------------------
// Yılan (iz yöntemi): trail = kafanın geçmiş konumları
// ---------------------------------------------------------------------
class Snake {
  constructor(id, name, color, x, y, brain) {
    this.id = id; this.name = name;
    this.setSkin(Array.isArray(color) ? color : [color]);
    this.brain = brain;               // Agent örneği veya null (insan)
    this.decisionInterval = WORLD.decisionInterval;  // zorluk ile değişir
    this.speedFactor = 1;                            // zorluk ile değişir (bot < 1)
    this.startMass = WORLD.startMass;                // kişiliğe göre değişebilir
    this.massCap = Infinity;                         // zorluk ile değişir (bot tavanı)
    this.bursts = 0;                                 // tavan patlaması sayısı
    this.reset(x, y);
  }
  reset(x, y) {
    this.x = x; this.y = y;
    this.angle = Math.random() * Math.PI * 2;
    this.mass = this.startMass ?? WORLD.startMass;
    this.score = this.mass;           // en yüksek kütle (yem yemeden ölürse 0 görünmesin)
    this.protection = WORLD.spawnProtection;
    this.trail = [];
    this.boosting = false;
    this.alive = true;
    this.deadTimer = 0;
    this.input = { targetAngle: this.angle, boost: false, debug: null };
    this.tick = 0;
    // Güçler (yalnızca kurallarda powerUps açıksa toplanır)
    this.shield = false;              // bir çarpışmayı emer
    this.magnet = 0;                  // kalan saniye: yakındaki yemi çeker
    this.turbo = 0;                   // kalan saniye: bedelsiz hızlanma
  }
  // skin: renk şeritleri listesi; color: ilk renk (skor tablosu, mini harita)
  setSkin(colors) { this.skin = colors; this.color = colors[0]; }
  get radius()     { return massToRadius(this.mass); }
  get bodyLength() { return 60 + this.mass * 4; }      // birim cinsinden gövde uzunluğu

  move(dt) {
    // Dönüş: hedef açıya doğru sınırlı hızla dön
    let diff = this.input.targetAngle - this.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // -PI..PI aralığına indir
    const maxTurn = WORLD.turnSpeed * dt;
    this.angle += Math.max(-maxTurn, Math.min(maxTurn, diff));

    // Boost: kütle yeterse. Turbo gücü bedelsiz ve kütle sınırı olmadan hızlandırır.
    const turbo = this.turbo > 0;
    this.boosting = turbo || (this.input.boost && this.mass > WORLD.minBoostMass);
    const speed = (this.boosting ? WORLD.boostSpeed : WORLD.baseSpeed) * this.speedFactor;
    this.speed = speed;                                 // algı paketi için
    if (this.boosting && !turbo) this.mass -= WORLD.boostCost * dt;

    this.x += Math.cos(this.angle) * speed * dt;
    this.y += Math.sin(this.angle) * speed * dt;

    // İz: yeni nokta ekle, gövde uzunluğunu aşan kuyruğu kırp
    const last = this.trail[0];
    if (!last || Math.hypot(this.x - last.x, this.y - last.y) >= WORLD.segmentSpacing) {
      this.trail.unshift({ x: this.x, y: this.y });
    }
    let len = 0;
    for (let i = 1; i < this.trail.length; i++) {
      len += Math.hypot(this.trail[i].x - this.trail[i-1].x, this.trail[i].y - this.trail[i-1].y);
      if (len > this.bodyLength) { this.trail.length = i; break; }
    }
  }
}

// Güç türleri ve süreleri
const POWER = {
  types: ['shield', 'magnet', 'turbo'],
  magnetTime: 8, magnetRadius: 170, magnetPull: 260,
  turboTime: 5,
  shieldGrace: 1.2,        // kalkan kırılınca bu kadar saniye dokunulmazlık
  perceivedValue: 12,      // ajanlar gücü "çok değerli yem" olarak görür (sözleşme değişmez)
};

// ---------------------------------------------------------------------
// Dünya
// rules (hepsi isteğe bağlı, varsayılanlar eğitim sürümünün davranışı):
//   respawn:  ölenler yeniden doğar mı (true)
//   powerUps: haritada tutulacak güç sayısı (0 = kapalı)
//   minFood:  alan küçülse de tutulacak en az yem
// bounds: oynanabilir dikdörtgen. Varsayılan tüm harita; daralan arena bunu her kare küçültür.
// ---------------------------------------------------------------------
class World {
  constructor(rules = {}) {
    this.rules = { respawn: true, powerUps: 0, minFood: 0, ...rules };
    this.bounds = { x0: 0, y0: 0, x1: WORLD.width, y1: WORLD.height };
    this.snakes = [];
    this.foods = [];
    this.powerUps = [];
    this.deathLog = [];                              // { snake, time, cause, killer } ölüm sırasıyla
    this.time = 0;
    this.frame = 0;
    this.nextId = 1;
    this.nextFoodId = 1;
    this.powerTimer = 0;
    this.foodEvents = { added: [], removed: [] };   // ağ sunucusu için yem değişiklik günlüğü
    while (this.foods.length < WORLD.foodCount) this.spawnFood();
    for (let i = 0; i < this.rules.powerUps; i++) this.spawnPowerUp();
  }

  // Sınırlar içinde rastgele nokta (kenardan pay bırakarak)
  randomPoint(margin = 20) {
    const b = this.bounds, w = b.x1 - b.x0, h = b.y1 - b.y0;
    const mx = Math.min(margin, w / 2), my = Math.min(margin, h / 2);
    return { x: b.x0 + mx + Math.random() * Math.max(0, w - 2 * mx), y: b.y0 + my + Math.random() * Math.max(0, h - 2 * my) };
  }
  inBounds(x, y) { const b = this.bounds; return x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1; }
  areaRatio() { const b = this.bounds; return Math.max(0, (b.x1 - b.x0) * (b.y1 - b.y0)) / (WORLD.width * WORLD.height); }

  spawnFood(x, y, value) {
    const p = (x === undefined) ? this.randomPoint(20) : null;
    const f = {
      id: this.nextFoodId++,
      x: x ?? p.x,
      y: y ?? p.y,
      value: value ?? 1 + Math.random() * 2,
    };
    this.foods.push(f);
    this.foodEvents.added.push(f);
    if (this.foods.length > WORLD.maxFoods) this.removeFood(0);   // en eski yem gider
  }

  removeFood(index) {
    this.foodEvents.removed.push(this.foods[index].id);
    this.foods.splice(index, 1);
  }

  spawnPowerUp() {
    const p = this.randomPoint(80);
    this.powerUps.push({ id: this.nextFoodId++, x: p.x, y: p.y, type: POWER.types[Math.floor(Math.random() * POWER.types.length)] });
  }

  addSnake(name, color, brain) {
    const { x, y } = this.safeSpot();
    const s = new Snake(this.nextId++, name, color, x, y, brain);
    this.snakes.push(s);
    return s;
  }

  // Kişilik listesinden botları ekle; zorluk ayarı tepki/hız/hata olarak uygulanır.
  // difficulty: DIFFICULTY içindeki bir ad veya aynı biçimde bir nesne.
  addBots(personalities, difficulty) {
    const d = (typeof difficulty === 'object' && difficulty) ? difficulty : (DIFFICULTY[difficulty] || DIFFICULTY.normal);
    for (const p of personalities) {
      const cfg = { ...p.config, noise: d.noise };
      const agent = new Agent(cfg);
      agent.config.huntRatio *= d.huntRatioScale;
      const s = this.addSnake(p.name, p.color, agent);
      s.decisionInterval = d.decisionInterval;
      s.speedFactor = d.speedFactor;
      s.massCap = d.massCap ?? Infinity;
      if (p.startMass) { s.startMass = p.startMass; s.mass = p.startMass; s.score = p.startMass; }
    }
  }

  // Diğer yılanlardan uzak, sınırlar içinde rastgele bir başlangıç noktası
  safeSpot() {
    const b = this.bounds, margin = Math.min(200, (b.x1 - b.x0) * 0.1);
    for (let tries = 0; tries < 50; tries++) {
      const { x, y } = this.randomPoint(margin);
      const ok = this.snakes.every(s => !s.alive || Math.hypot(s.x - x, s.y - y) > 300);
      if (ok) return { x, y };
    }
    return this.randomPoint(margin);
  }

  // Ana adım: her karede bir kez çağrılır
  step(dt) {
    this.time += dt;
    this.frame++;
    const b = this.bounds;

    // 1) Ajanlar düşünür (her N karede bir)
    for (const s of this.snakes) {
      if (!s.alive) continue;
      s.tick++;
      if (s.brain && s.tick % s.decisionInterval === 0) {
        s.input = s.brain.decide(this.perceive(s));
      }
    }

    // 2) Hareket (+ koruma ve güç sayaçları)
    for (const s of this.snakes) {
      if (!s.alive) continue;
      s.move(dt);
      if (s.protection > 0) s.protection -= dt;
      if (s.magnet > 0) s.magnet -= dt;
      if (s.turbo > 0) s.turbo -= dt;
    }

    // 3) Yem yeme (mıknatıs: yakındaki yemi kafaya doğru çeker)
    for (const s of this.snakes) {
      if (!s.alive) continue;
      const r = s.radius + 4;
      const pullR = s.magnet > 0 ? POWER.magnetRadius : 0;
      const reach = Math.max(r, pullR);
      for (let i = this.foods.length - 1; i >= 0; i--) {
        const f = this.foods[i];
        const dx = f.x - s.x, dy = f.y - s.y;
        if (Math.abs(dx) >= reach || Math.abs(dy) >= reach) continue;
        const d = Math.hypot(dx, dy);
        if (d < r) {
          s.mass += f.value;
          s.score = Math.max(s.score, s.mass);
          this.removeFood(i);
        } else if (d < pullR) {
          const k = Math.min(1, POWER.magnetPull * dt / d);
          f.x -= dx * k; f.y -= dy * k;
        }
      }
      // Güç toplama
      for (let i = this.powerUps.length - 1; i >= 0; i--) {
        const p = this.powerUps[i];
        if (Math.hypot(p.x - s.x, p.y - s.y) < s.radius + 14) {
          if (p.type === 'shield') s.shield = true;
          else if (p.type === 'magnet') s.magnet = POWER.magnetTime;
          else if (p.type === 'turbo') s.turbo = POWER.turboTime;
          s.powersTaken = (s.powersTaken || 0) + 1;
          this.powerUps.splice(i, 1);
        }
      }
    }

    // 4) Çarpışma: duvar ve gövdeler (önce hepsini tespit et, sonra öldür)
    const dead = [];
    for (const s of this.snakes) {
      if (!s.alive) continue;
      if (s.x < b.x0 || s.y < b.y0 || s.x > b.x1 || s.y > b.y1) { dead.push([s, null]); continue; }
      if (s.protection > 0) continue;                       // korumalı: yılanlara çarpmaz (duvara çarpar)
      for (const o of this.snakes) {
        if (o === s || !o.alive || o.protection > 0) continue;   // korumalıya çarpılmaz
        const hitDist = s.radius + o.radius * 0.8;
        let hit = Math.hypot(o.x - s.x, o.y - s.y) < hitDist;    // kafa-kafaya
        if (!hit) {
          for (const pt of o.trail) {
            if (Math.abs(pt.x - s.x) < hitDist && Math.abs(pt.y - s.y) < hitDist &&
                Math.hypot(pt.x - s.x, pt.y - s.y) < hitDist) { hit = true; break; }
          }
        }
        if (hit) {
          if (s.shield) { s.shield = false; s.protection = POWER.shieldGrace; s.shieldsUsed = (s.shieldsUsed || 0) + 1; }
          else dead.push([s, o]);
          break;
        }
      }
    }
    for (const [s, killer] of dead) {
      this.kill(s, killer ? 'snake' : 'wall', killer);
      if (killer) killer.kills = (killer.kills || 0) + 1;   // "av yakalama" sayacı
    }

    // 4b) Bot kütle tavanı: dev bot patlar, gövdesi ziyafete dönüşür
    for (const s of this.snakes) {
      if (s.alive && s.brain && s.mass > s.massCap) { this.kill(s, 'burst'); s.bursts++; s.deaths--; this.deathLog.pop(); }
    }

    // 5) Yeniden doğma
    if (this.rules.respawn) {
      for (const s of this.snakes) {
        if (s.alive) continue;
        s.deadTimer += dt;
        if (s.deadTimer >= WORLD.respawnDelay) { const p = this.safeSpot(); s.reset(p.x, p.y); }
      }
    }

    // 6) Yem ve güç dengesi. Alan daraldıysa hedefler alanla küçülür, dışarıda kalanlar silinir.
    const ratio = this.areaRatio();
    if (ratio < 1 && this.frame % 15 === 0) {
      for (let i = this.foods.length - 1; i >= 0; i--) if (!this.inBounds(this.foods[i].x, this.foods[i].y)) this.removeFood(i);
      for (let i = this.powerUps.length - 1; i >= 0; i--) if (!this.inBounds(this.powerUps[i].x, this.powerUps[i].y)) this.powerUps.splice(i, 1);
    }
    const foodTarget = Math.max(this.rules.minFood, Math.round(WORLD.foodCount * ratio));
    while (this.foods.length < foodTarget) this.spawnFood();
    if (this.rules.powerUps > 0) {
      const powerTarget = Math.max(2, Math.round(this.rules.powerUps * Math.sqrt(ratio)));
      this.powerTimer += dt;
      if (this.powerUps.length < powerTarget && this.powerTimer >= 4) { this.spawnPowerUp(); this.powerTimer = 0; }
    }
  }

  kill(s, cause = 'snake', killer = null) {
    // Gövde yeme dönüşür: her 5. iz noktasına bir yem, değeri kütleyle artar ama 6 ile tavanlanır
    // (eski: her 3. nokta, 2 + kütle*0.02; 400 kütlede yüzlerce büyük yem, yem patlaması)
    const value = Math.min(6, 1.5 + s.mass * 0.01);
    for (let i = 0; i < s.trail.length; i += 5) {
      const pt = s.trail[i];
      this.spawnFood(pt.x + (Math.random() - .5) * 10, pt.y + (Math.random() - .5) * 10, value);
    }
    s.alive = false;
    s.deadTimer = 0;
    s.deaths = (s.deaths || 0) + 1;
    s.deathCause = cause; s.killer = killer; s.deathMass = s.mass;
    this.deathLog.push({ snake: s, time: this.time, cause, killer });
  }

  // -------------------------------------------------------------------
  // ALGI PAKETİ: agent.js içindeki sözleşmeye birebir uyar.
  // Sınırlı görüş: sadece visionRadius içindekiler verilir.
  // Duvar mesafeleri oynanabilir sınırlara göredir; daralan arenada ajan kodu değişmeden çalışır.
  // Güçler ajana "çok değerli yem" olarak sunulur.
  // -------------------------------------------------------------------
  perceive(s) {
    const R = WORLD.visionRadius, b = this.bounds;
    const inRange = (px, py) => Math.abs(px - s.x) < R && Math.abs(py - s.y) < R &&
                                Math.hypot(px - s.x, py - s.y) < R;
    const foods = this.foods.filter(f => inRange(f.x, f.y) && f.x >= b.x0 && f.x <= b.x1 && f.y >= b.y0 && f.y <= b.y1);
    for (const p of this.powerUps) if (inRange(p.x, p.y)) foods.push({ x: p.x, y: p.y, value: POWER.perceivedValue, power: p.type });
    const snakes = [];
    for (const o of this.snakes) {
      if (o === s || !o.alive || o.protection > 0) continue;   // korumalı yılan ajanlara görünmez
      const segments = [];
      for (let i = 0; i < o.trail.length; i += 2) {       // her 2. nokta yeter
        const pt = o.trail[i];
        if (inRange(pt.x, pt.y)) segments.push(pt);
      }
      const headVisible = inRange(o.x, o.y);
      if (!headVisible && segments.length === 0) continue;
      // Basitleştirme: gövdesi görünen yılanın kafası da verilir (avlama için gerekli)
      snakes.push({ id: o.id, mass: o.mass, head: { x: o.x, y: o.y, angle: o.angle, speed: o.speed || WORLD.baseSpeed * o.speedFactor }, segments });
    }
    return {
      self: { x: s.x, y: s.y, angle: s.angle, mass: s.mass, boosting: s.boosting, speed: s.speed || WORLD.baseSpeed * s.speedFactor },
      foods, snakes,
      walls: { left: s.x - b.x0, right: b.x1 - s.x, top: s.y - b.y0, bottom: b.y1 - s.y },
      visionRadius: R,
    };
  }
}

<script>
// =====================================================================
// render-temel.js — Bütün oyunların paylaştığı çizim çekirdeği:
// canvas boyutu, kamera, koordinat dönüşümü ve renk yardımcıları.
// Oyuna özgü hiçbir çizim burada yok; her oyun bu sınıfı genişletir.
// =====================================================================

class RenderBase {
  // opts.size = { w, h }: pencereye değil sabit bir boyuta çizer (klip dışa aktarma gibi ekran dışı işler)
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.fixed = opts.size || null;
    this.zoom = 1;
    this.camX = 0; this.camY = 0;
    this.time = 0;
    this.resize();
    if (!this.fixed) window.addEventListener('resize', () => this.resize());
  }

  // Görünüm boyutu (CSS pikseli): HUD ve ekran koordinatları buna göre
  get viewW() { return this.fixed ? this.fixed.w : window.innerWidth; }
  get viewH() { return this.fixed ? this.fixed.h : window.innerHeight; }

  resize() {
    const dpr = this.fixed ? 1 : Math.min(devicePixelRatio || 1, 1.5);   // 3x telefon ekranında piksel sayısını sınırla
    this.dpr = dpr;
    this.canvas.width  = Math.max(1, this.viewW * dpr);
    this.canvas.height = Math.max(1, this.viewH * dpr);
  }

  // Kamera: hedefi yumuşakça izle ve istenen yakınlığa yaklaş.
  // İstenen yakınlığı her oyun kendi updateCamera(target, dt) yönteminde hesaplar.
  follow(target, dt, wantZoom) {
    this.time += dt;
    if (!target) return;
    this.zoom += (wantZoom - this.zoom) * Math.min(1, dt * 3);
    this.camX += (target.x - this.camX) * Math.min(1, dt * 8);
    this.camY += (target.y - this.camY) * Math.min(1, dt * 8);
    this.clampCamera();
  }

  // Kamera haritanın dışını göstermesin: görüş alanı sınırların içinde kalır,
  // harita ekrandan küçükse ortalanır. Kenara giden oyuncu ekranda kenara kayar.
  clampCamera() {
    const vw = this.canvas.width / (this.zoom * this.dpr), vh = this.canvas.height / (this.zoom * this.dpr);
    const m = 6;   // duvar çizgisi görünsün diye küçük pay
    this.camX = vw >= WORLD.width  + 2 * m ? WORLD.width  / 2 : Math.min(Math.max(this.camX, vw / 2 - m), WORLD.width  - vw / 2 + m);
    this.camY = vh >= WORLD.height + 2 * m ? WORLD.height / 2 : Math.min(Math.max(this.camY, vh / 2 - m), WORLD.height - vh / 2 + m);
  }

  // Dünya noktası ekranda nerede (CSS pikseli). Kamera kenara kilitlendiğinde oyuncu merkezde olmaz;
  // fare yönü ekran merkezine göre değil, oyuncunun ekrandaki yerine göre hesaplanmalı.
  worldToScreen(x, y) {
    return { x: this.viewW / 2 + (x - this.camX) * this.zoom, y: this.viewH / 2 + (y - this.camY) * this.zoom };
  }

  // Renk yardımcıları (#rrggbb)
  hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  lighten(c, k) { const [r, g, b] = this.hex(c); return `rgb(${r + (255 - r) * k | 0},${g + (255 - g) * k | 0},${b + (255 - b) * k | 0})`; }
  darken(c, k)  { const [r, g, b] = this.hex(c); return `rgb(${r * (1 - k) | 0},${g * (1 - k) | 0},${b * (1 - k) | 0})`; }
  withAlpha(c, a) { const [r, g, b] = this.hex(c); return `rgba(${r},${g},${b},${a})`; }
}

</script>
<script>
// =====================================================================
// render-yilan.js — Yılan gövdesi çizimi. Yalnızca yılanlı oyunlar yükler
// (eğitim sürümü ve Kumul). Bir çizim sınıfına şöyle eklenir:
//   Object.assign(Sinif.prototype, SnakeDrawing)
// Sınıftan beklenenler: ctx, zoom, lighten/darken/withAlpha; isteğe bağlı nameColor, ringColor.
// =====================================================================

const SnakeDrawing = {
  // Kamera: yılan büyüdükçe uzaklaş
  updateCamera(target, dt) {
    this.follow(target, dt, target ? Math.max(0.35, 1 / (1 + Math.sqrt(Math.max(0, target.mass - 20)) / 12)) : 1);
  },

  // Gövde: kalın çizgi (koyu kenar + renkli iç), yakın zoom'da boğum vurguları
  drawSnakeBody(s) {
    const ctx = this.ctx;
    const r = s.radius;
    const pts = s.trail;
    const light = this.lighten(s.color, 0.35), dark = this.darken(s.color, 0.35);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (s.boosting) {
      ctx.strokeStyle = this.withAlpha(s.color, 0.35); ctx.lineWidth = r * 2.8;
      this.strokeTrail(s, pts);
    }
    ctx.strokeStyle = dark; ctx.lineWidth = r * 2;  this.strokeTrail(s, pts);
    const skin = s.skin && s.skin.length > 1 ? s.skin : null;
    if (!skin) { ctx.strokeStyle = s.color; ctx.lineWidth = r * 1.7; this.strokeTrail(s, pts); }
    else this.strokeBands(s, pts, skin, r);

    // Boğum vurguları: sadece yakınken, en fazla ~40 tane
    if (this.zoom >= 0.55) {
      const step = Math.max(1, Math.round((r * 0.9) / WORLD.segmentSpacing), Math.ceil(pts.length / 40));
      ctx.fillStyle = light;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i += step) { const p = pts[i]; ctx.moveTo(p.x - r * 0.3 + r * 0.4, p.y - r * 0.3); ctx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.4, 0, Math.PI * 2); }
      ctx.fill();
    }

    // Kafa
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x - r * 0.1, s.y - r * 0.1, r * 0.9, 0, Math.PI * 2); ctx.fill();
    // Doğum koruması: kesikli halka
    if (s.protection > 0) {
      ctx.strokeStyle = this.ringColor || 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2 / this.zoom; ctx.setLineDash([6 / this.zoom, 5 / this.zoom]);
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.2, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    // Gözler: yan yana, bakış yönü gidiş yönü
    const ex = Math.cos(s.angle), ey = Math.sin(s.angle), px = -ey, py = ex;
    for (const side of [-1, 1]) {
      const cx = s.x + ex * r * 0.35 + px * r * 0.48 * side, cy = s.y + ey * r * 0.35 + py * r * 0.48 * side;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx + ex * r * 0.14, cy + ey * r * 0.14, r * 0.18, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = this.nameColor || 'rgba(255,255,255,0.8)';
    ctx.font = `${12 / this.zoom}px system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(s.name, s.x, s.y - r - 8 / this.zoom);
  },

  // Şeritli skin: iz noktalarını bant bant farklı renkle çiz (gövde boyunca tekrar eden renk dizisi)
  strokeBands(s, pts, skin, r) {
    const ctx = this.ctx;
    const bandPts = Math.max(2, Math.round((r * 1.6) / WORLD.segmentSpacing));   // bir şerit ~1.6 yarıçap uzunluğunda
    ctx.lineWidth = r * 1.7;
    let i = 0, band = 0;
    let prevX = s.x, prevY = s.y;
    while (i < pts.length) {
      ctx.strokeStyle = skin[band % skin.length];
      ctx.beginPath(); ctx.moveTo(prevX, prevY);
      const end = Math.min(pts.length, i + bandPts);
      for (let k = i; k < end; k++) ctx.lineTo(pts[k].x, pts[k].y);
      ctx.stroke();
      prevX = pts[end - 1].x; prevY = pts[end - 1].y;
      i = end; band++;
    }
  },

  strokeTrail(s, pts) {
    const ctx = this.ctx;
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    const step = this.zoom < 0.5 ? 2 : 1;                          // uzaktan her 2. nokta yeter
    for (let i = 0; i < pts.length; i += step) ctx.lineTo(pts[i].x, pts[i].y);
    if (pts.length && step > 1) ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    ctx.stroke();
  },
};

<script>
// =====================================================================
// kumul-ortak.js — Kumul ailesindeki oyunların paylaştığı parçalar:
// skinler, bot isimleri, reklam kancaları ve daralan arena turunun iskeleti.
// Her oyun kendi ARENA ayarını ve kendi Round sınıfını (RoundBase üzerinden) tanımlar.
// =====================================================================

// Kum zeminde okunan doygun tonlar (kendi paletimiz).
// level: ilerleme açıksa bu görünümün açıldığı seviye (botlar hepsini kullanır, vitrin görevi görür).
const KUMUL_SKINS = [
  { name: 'Çini',     level: 1, colors: ['#0e7c7b', '#fdfcf7'] },
  { name: 'Nar',      level: 1, colors: ['#c1121f'] },
  { name: 'Gece',     level: 1, colors: ['#1b1b1e', '#f2a104'] },
  { name: 'Lacivert', level: 2, colors: ['#1d3a8a', '#fdfcf7'] },
  { name: 'Zümrüt',   level: 2, colors: ['#1f9d55'] },
  { name: 'Mor Dağ',  level: 3, colors: ['#6d28d9', '#c4b5fd'] },
  { name: 'Kobra',    level: 4, colors: ['#1b1b1e', '#fdfcf7'] },
  { name: 'Akrep',    level: 5, colors: ['#7c2d12', '#f2a104'] },
  { name: 'Vaha',     level: 6, colors: ['#0e7c7b', '#1f9d55', '#a7f3d0'] },
  { name: 'Lale',     level: 7, colors: ['#db2777', '#fdfcf7'] },
  { name: 'Bulut',    level: 8, colors: ['#334155', '#94a3b8'] },
  { name: 'Şafak',    level: 9, colors: ['#f77f00', '#c1121f', '#6d28d9'] },
  // Gizli başarımla açılanlar (ach: başarım anahtarı). Seviye ile açılmaz; botlar da kullanmaz.
  { name: 'Çalıntı Altın', level: 99, ach: 'hirsiz',   colors: ['#d4a017', '#8a5a00', '#ffe082'] },
  { name: 'Kum Bulutu',    level: 99, ach: 'nefes',    colors: ['#d6bf8a', '#a98a55'] },
  { name: 'Kaya',          level: 99, ach: 'cifte',    colors: ['#6b6b6b', '#3f3f3f', '#9a9a9a'] },
  { name: 'Yırtık',        level: 99, ach: 'pacavra',  colors: ['#8b5a2b', '#3b2a1a', '#c9a66b'] },
  { name: 'Beyaz',         level: 99, ach: 'pasifist', colors: ['#fdfcf7', '#e5e1d3'] },
  { name: 'Samanyolu',     level: 99, ach: 'samanyolu', colors: ['#1b1b4b', '#f2a104', '#fdfcf7'] },
];

// ---------------------------------------------------------------------
// Tohumlu rastgele üreteç (mulberry32). Simülasyonu etkileyen her rastgele sayı buradan gelir;
// aynı tohum aynı botları, aynı topakları ve aynı turu üretir (meydan okuma linki, klip tekrarı).
// Yalnızca çizim ve sesteki rastgelelik Math.random kullanmaya devam eder.
// ---------------------------------------------------------------------
const Rng = {
  state: 0,
  seed(s) { this.state = s >>> 0; },
  next() {
    let t = (this.state = (this.state + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  randomSeed() { return (Math.random() * 4294967296) >>> 0; },
};
// Tohumun paylaşılabilir hali: 32 bit sayı <-> büyük harf 36 tabanlı kod (en çok 7 karakter)
const seedToCode = s => (s >>> 0).toString(36).toUpperCase();
const codeToSeed = code => { const n = parseInt(String(code || ''), 36); return Number.isFinite(n) && n >= 0 ? n >>> 0 : null; };

// Özgün bot isimleri
const BOT_NAMES = ['Zikzak', 'Tıslak', 'Kıvrım', 'Poyraz', 'Çıngırak', 'Fırfır', 'Sinsi', 'Dolambaç', 'Kuyruk', 'Şerit',
  'Yalaz', 'Girdap', 'Sarmal', 'Kamçı', 'Düğüm', 'Halka', 'Burgu', 'Kement', 'Fiyonk', 'Tırtıl',
  'Makarna', 'Erişte', 'Hortum', 'Kordon', 'Urgan', 'Lokum', 'Sülük', 'Pençe', 'Sekiz'];
function pickBotNames(n) {
  const names = [...BOT_NAMES];
  for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(Rng.next() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
  return Array.from({ length: n }, (_, i) => names[i % names.length]);
}

// ---------------------------------------------------------------------
// Reklam ve portal kancaları. Portal, alan adından ya da ?portal= parametresinden tanınır; SDK betiği
// yalnızca o portalda yüklenir (kendi adresimizde dış istek yok). Portal yoksa hiçbir şey göstermez,
// ödüllü reklam "izlendi" sayılır (geliştirme). Oyun akışı yalnız bu dört çağrıyı kullanır:
//   interstitial() tur arası · rewarded() ödüllü (true = ödül ver) · gameplayStart() / gameplayStop()
// Kurallar: ara reklam en az MIN_GAP saniyede bir (CrazyGames: 3 dakikada 1); reklam sırasında ses kısılır
// ve oyun durur (onAdStart / onAdEnd kancaları, kumul-main.js bağlar).
// ---------------------------------------------------------------------
const Ads = {
  MIN_GAP: 180,                                        // sn: iki ara reklam arasında en az
  portal: null, ready: false, lastInterstitial: -1e9, onAdStart: null, onAdEnd: null,
  detect() {
    const q = new URLSearchParams(location.search).get('portal'), h = location.hostname;
    if (q === 'crazygames' || /crazygames|1001juegos|1001games|jeux\.fr|speelspelletjes/.test(h)) return 'crazygames';
    if (q === 'poki' || /poki\./.test(h)) return 'poki';
    return null;
  },
  load(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); },
  async init() {
    this.portal = this.detect();
    try {
      if (this.portal === 'crazygames') { await this.load('https://sdk.crazygames.com/crazygames-sdk-v3.js'); await window.CrazyGames.SDK.init(); this.ready = true; }
      else if (this.portal === 'poki') { await this.load('https://game-cdn.poki.com/scripts/v2/poki-sdk.js'); await window.PokiSDK.init(); this.ready = true; }
    } catch (e) { this.ready = false; }
    return this.ready;
  },
  loadingFinished() { if (this.ready && this.portal === 'poki') window.PokiSDK.gameLoadingFinished(); },
  gameplayStart() { if (!this.ready) return; if (this.portal === 'poki') window.PokiSDK.gameplayStart(); else window.CrazyGames.SDK.game.gameplayStart(); },
  gameplayStop()  { if (!this.ready) return; if (this.portal === 'poki') window.PokiSDK.gameplayStop(); else window.CrazyGames.SDK.game.gameplayStop(); },
  happy() { if (this.ready && this.portal === 'crazygames') window.CrazyGames.SDK.game.happytime(); },   // galibiyet gibi iyi anlar
  // Tur arası reklam: sıklık sınırı; portal yoksa anında döner
  async interstitial() {
    const now = performance.now() / 1000;
    if (!this.ready || now - this.lastInterstitial < this.MIN_GAP) return;
    this.lastInterstitial = now;
    if (this.onAdStart) this.onAdStart();
    try {
      if (this.portal === 'poki') await window.PokiSDK.commercialBreak();
      else await new Promise(res => window.CrazyGames.SDK.ad.requestAd('midgame', { adFinished: res, adError: res, adStarted: () => {} }));
    } catch {}
    if (this.onAdEnd) this.onAdEnd();
  },
  // Ödüllü reklam: izlenirse true
  async rewarded() {
    if (!this.ready) return true;
    if (this.onAdStart) this.onAdStart();
    let ok = false;
    try {
      if (this.portal === 'poki') ok = await window.PokiSDK.rewardedBreak();
      else ok = await new Promise(res => window.CrazyGames.SDK.ad.requestAd('rewarded', { adFinished: () => res(true), adError: () => res(false), adStarted: () => {} }));
    } catch { ok = false; }
    if (this.onAdEnd) this.onAdEnd();
    return ok;
  },
};

// ---------------------------------------------------------------------
// Daralan arena turu. Alt sınıf this.world, this.player ve this.total değerlerini kurar.
// Dünyadan beklenenler: bounds, step(dt), snakes[], deathLog[], safeSpot().
// Oyuncudan beklenenler: alive, deathMass, reset(x, y).
// ARENA: size, calm, shrinkEnd, finalEnd, midSize.
// Tohum: verilmezse rastgele; alt sınıf dünyayı kurmadan önce super(seed) çağırır ki üreteç kurulu olsun.
// ---------------------------------------------------------------------
class RoundBase {
  constructor(seed) {
    this.seed = (seed ?? Rng.randomSeed()) >>> 0;
    Rng.seed(this.seed);
    this.time = 0; this.over = false; this.winner = null;
  }
  get code() { return seedToCode(this.seed); }

  // Arena kenarı (birim), zamana göre
  zoneSide(t = this.time) {
    const A = ARENA;
    if (t <= A.calm) return A.size;
    if (t <= A.shrinkEnd) return A.size + (A.midSize - A.size) * (t - A.calm) / (A.shrinkEnd - A.calm);
    if (t <= A.finalEnd) return A.midSize * (1 - (t - A.shrinkEnd) / (A.finalEnd - A.shrinkEnd));
    return 0;
  }

  // HUD için: hangi evre ve evrenin bitimine kaç saniye
  phase() {
    const A = ARENA, t = this.time;
    if (t < A.calm) return { key: 'calm', left: A.calm - t };
    if (t < A.shrinkEnd) return { key: 'shrink', left: A.shrinkEnd - t };
    return { key: 'final', left: Math.max(0, A.finalEnd - t) };
  }

  aliveCount() { let n = 0; for (const s of this.world.snakes) if (s.alive) n++; return n; }

  step(dt) {
    if (this.over) return;
    this.time += dt;
    const side = this.zoneSide(), c = ARENA.size / 2;
    this.world.bounds = { x0: c - side / 2, y0: c - side / 2, x1: c + side / 2, y1: c + side / 2 };
    this.world.step(dt);

    const alive = this.world.snakes.filter(s => s.alive);
    if (alive.length <= 1) {
      this.over = true;
      if (alive.length === 1) this.winner = alive[0];
      else {
        // Hepsi aynı anda elendiyse: son karede elenenlerin en büyüğü kazanır
        const log = this.world.deathLog, lastTime = log.length ? log[log.length - 1].time : 0;
        const last = log.filter(e => e.time === lastTime).sort((a, b) => b.snake.deathMass - a.snake.deathMass);
        this.winner = last.length ? last[0].snake : null;
      }
    }
  }

  // Sıralama: kazanan 1, ilk elenen sonuncu
  placementOf(who) {
    if (who === this.winner) return 1;
    if (who.alive) return this.aliveCount();
    const idx = this.world.deathLog.findIndex(e => e.snake === who);
    return idx < 0 ? this.total : this.total - idx;
  }

  // Ödüllü reklam karşılığı diriliş: güvenli bir noktada yeniden başlar
  canRevive() { return !this.over && this.aliveCount() > 1 && this.zoneSide() > 500; }
  revive(who) {
    const w = this.world, i = w.deathLog.findIndex(e => e.snake === who);
    if (i >= 0) w.deathLog.splice(i, 1);
    const p = w.safeSpot();
    who.reset(p.x, p.y);
  }
}

const Lang = {
  code: 'tr',
  init() {
    let saved = null;
    try { saved = localStorage.getItem('kumul-lang'); } catch {}

    this.applyDom();
  },
  t(key, ...a) {
    const d = DIL[this.code] || DIL.tr;
    let v = d[key]; if (v === undefined) v = DIL.tr[key]; if (v === undefined) return key;
    return typeof v === 'function' ? v(...a) : v;
  },
  set(code) { this.code = code; try { localStorage.setItem('kumul-lang', code); } catch {} this.applyDom(); },
  toggle() { this.set(this.code === 'tr' ? 'en' : 'tr'); },
  // data-t: metin, data-t-ph: placeholder, data-t-aria: aria-label
  applyDom() {
    if (typeof document === 'undefined') return;
    document.documentElement.lang = this.code;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = this.t(el.dataset.t);
    for (const el of document.querySelectorAll('[data-t-ph]')) el.placeholder = this.t(el.dataset.tPh);
    for (const el of document.querySelectorAll('[data-t-aria]')) el.setAttribute('aria-label', this.t(el.dataset.tAria));
  },
};
const T = (key, ...a) => Lang.t(key, ...a);

const skinName = sk => { const v = (DIL[Lang.code] || {})['skin:' + sk.name]; return v || sk.name; };

<script>
// =====================================================================
// kumul-ses.js — Ses efektleri. Dosya yok: bütün sesler tarayıcıda sentezlenir (Web Audio).
// Tarayıcılar sesi ancak kullanıcı bir yere bastıktan sonra açar; init() "Oyna" tıklamasında çağrılır.
// =====================================================================

const Sfx = {
  ac: null, master: null, muted: false,

  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      // Sıkıştırıcı: birkaç ses aynı anda gelince toplam taşmasın (taşma da cızırtı yapar)
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15;
      this.master.connect(comp); comp.connect(this.ac.destination);
    } catch { this.ac = null; }
  },

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.55; },

  // Kayan frekanslı tek ses
  tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!this.ac || this.muted || vol <= 0.003) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },

  // Süzülmüş gürültü (çarpma, hışırtı)
  noise(dur, vol, cutoff) {
    if (!this.ac || this.muted || vol <= 0.003) return;
    const ac = this.ac, n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
  },

  // Aynı ses bu aralıktan sık çalınmaz. Üst üste binen onlarca kısa ses kulağa cızırtı gibi gelir;
  // sıkışık anlarda (son daralma) saniyede onlarca çarpma olur.
  last: {},
  ready(key, gap) {
    if (!this.ac) return false;
    const t = this.ac.currentTime;
    if (t - (this.last[key] ?? -9) < gap) return false;
    this.last[key] = t;
    return true;
  },

  hit(power, vol = 1)  { if (vol * power < 0.04 || !this.ready('hit', 0.09)) return;
                         this.tone(170 + 70 * power, 55, 0.14 + 0.12 * power, 'triangle', 0.5 * vol * (0.4 + power)); this.noise(0.09, 0.3 * vol * power, 1100); },
  dash(vol = 1)        { if (vol < 0.05 || !this.ready('dash', 0.12)) return;
                         this.noise(0.2, 0.16 * vol, 2200); this.tone(260, 640, 0.13, 'sine', 0.1 * vol); },
  pellet()             { if (this.ready('pellet', 0.05)) this.tone(900, 1350, 0.05, 'sine', 0.07); },
  power()              { this.tone(520, 1040, 0.16, 'square', 0.09); this.tone(780, 1560, 0.18, 'square', 0.08, 0.1); },
  out(vol = 1)         { if (vol < 0.05 || !this.ready('out', 0.25)) return;
                         this.tone(520, 90, 0.38, 'sawtooth', 0.14 * vol); },
  score()              { this.tone(660, 990, 0.12, 'triangle', 0.22); this.tone(990, 1320, 0.16, 'triangle', 0.2, 0.1); },
  launch(vol = 1)      { if (vol < 0.05 || !this.ready('launch', 0.15)) return;
                         this.noise(0.3, 0.22 * vol, 900); this.tone(140, 60, 0.3, 'triangle', 0.25 * vol); },
  grab(stolen)         { if (!this.ready('grab', 0.1)) return;
                         this.tone(330, 660, 0.09, 'sine', 0.16); if (stolen) this.tone(660, 1320, 0.14, 'square', 0.09, 0.08); },
  breath()             { [0, 0.2, 0.4].forEach(d => this.tone(880, 880, 0.12, 'square', 0.14, d)); },
  escape()             { this.noise(0.25, 0.18, 1600); this.tone(200, 900, 0.3, 'sine', 0.18); },
  dig(vol = 1)         { if (vol < 0.05 || !this.ready('dig', 0.2)) return; this.noise(0.28, 0.22 * vol, 500); this.tone(120, 60, 0.25, 'sine', 0.12 * vol); },
  stamp()              { this.noise(0.12, 0.3, 700); this.tone(90, 45, 0.35, 'triangle', 0.4); this.tone(440, 880, 0.25, 'square', 0.1, 0.06); },
  lose()               { this.tone(330, 110, 0.55, 'triangle', 0.3); this.tone(247, 82, 0.6, 'sine', 0.2, 0.08); },
  win()                { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.22, 'triangle', 0.26, i * 0.13)); },
  levelUp()            { [660, 880, 1320].forEach((f, i) => this.tone(f, f * 1.01, 0.16, 'square', 0.1, i * 0.09)); },
};

<script>
// =====================================================================
// kumul-ilerleme.js — Kalıcılık: puan, seviye, görünüm kilitleri, günlük görev.
// Amaç: oyuncunun yarın geri gelmesi için bir sebep. Veriler tarayıcıda saklanır.
// Yalnızca mantık; ekrana yazmak kumul-main.js'in işi.
// =====================================================================

// Küçük kalıcı veri yardımcısı. Depolama kapalıysa oyun yine çalışır.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const Progress = {
  MISSION_REWARD: 200,

  init(key, skins, missions) {
    this.key = key + '-progress'; this.skins = skins; this.missions = missions || [];
    this.data = store.get(this.key, { xp: 0, unlocked: [], mission: null });
    this.todayMission();
  },
  save() { store.set(this.key, this.data); },

  // Bir turun puanı: sıra + düşürme + galibiyet + katılım; ödeşme (rakibini elemek) turu ikiye katlar
  xpFor(r) { return ((r.total - r.place) * 5 + r.kills * 15 + (r.place === 1 ? 50 : 0) + 10) * (r.revenge ? 2 : 1); },

  // Seviye L'den L+1'e geçmek için gereken puan
  need(level) { return 150 + 100 * (level - 1); },
  levelInfo(xp = this.data.xp) {
    let level = 1, left = xp;
    while (left >= this.need(level)) { left -= this.need(level); level++; }
    return { level, into: left, need: this.need(level) };
  },

  // Başarım görünümleri yalnızca unlocked listesiyle açılır; diğerleri seviyeyle ya da reklamla
  skinLocked(i) { const s = this.skins[i]; return !this.data.unlocked.includes(i) && (s.ach ? true : (s.level || 1) > this.levelInfo().level); },
  unlockSkin(i) { if (!this.data.unlocked.includes(i)) { this.data.unlocked.push(i); this.save(); } },

  // Görünüm ustalığı: aynı görünümle 20 / 50 / 100 tur = 1 / 2 / 3 yıldız; yalnızca kozmetik
  MASTERY: [20, 50, 100],
  skinRounds(i) { return (this.data.skinRounds || {})[i] || 0; },
  masteryOf(i) { const n = this.skinRounds(i); return this.MASTERY.filter(t => n >= t).length; },
  addSkinRound(i) { this.data.skinRounds = this.data.skinRounds || {}; this.data.skinRounds[i] = this.skinRounds(i) + 1; this.save(); return this.masteryOf(i); },

  // Günün görevi: gün numarasına göre sırayla seçilir, gün değişince sıfırlanır
  todayMission() {
    if (!this.missions.length) return null;
    const d = new Date(), date = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const m = this.data.mission;
    if (!m || m.date !== date) {
      const def = this.missions[Math.floor(Date.now() / 86400000) % this.missions.length];
      this.data.mission = { date, id: def.id, progress: 0, done: false };
      this.save();
    }
    const def = this.missions.find(x => x.id === this.data.mission.id) || this.missions[0];
    return { ...def, progress: Math.min(def.target, this.data.mission.progress), done: this.data.mission.done };
  },

  // Tur sonucunu işle. prev: aynı turda daha önce yazılmış sonuç (dirilişten önceki), yoksa null.
  // Diriliş sonrası yalnızca aradaki fark eklenir, aynı tur iki kez sayılmaz.
  addRound(now, prev) {
    const before = this.levelInfo();
    let gain = this.xpFor(now) - (prev ? this.xpFor(prev) : 0);

    let missionDone = false;
    const m = this.todayMission();
    if (m && !m.done) {
      const delta = {
        kills:  now.kills - (prev ? prev.kills : 0),
        powers: now.powers - (prev ? prev.powers : 0),
        rounds: prev ? 0 : 1,
        top5:   (now.place <= 5 ? 1 : 0) - (prev && prev.place <= 5 ? 1 : 0),
        wins:   (now.place === 1 ? 1 : 0) - (prev && prev.place === 1 ? 1 : 0),
      }[m.metric] || 0;
      this.data.mission.progress += Math.max(0, delta);
      if (this.data.mission.progress >= m.target) { this.data.mission.done = true; missionDone = true; gain += this.MISSION_REWARD; }
    }

    this.data.xp += Math.max(0, gain);
    this.save();
    const after = this.levelInfo();
    const newSkins = this.skins.filter(s => !s.ach && (s.level || 1) > before.level && (s.level || 1) <= after.level).map(s => s.name);
    return { gain: Math.max(0, gain), before, after, leveledUp: after.level > before.level, newSkins, missionDone };
  },
};

// ---------------------------------------------------------------------
// Sezon: 4 hafta. Sezon puanı tur puanıyla birlikte birikir; 10 basamaklı ücretsiz ödül hattı,
// her basamak bir Kum Kutusu (3 karttan biri). Sezon bitince kademe sıfırlanır, kozmetik kalır.
// ---------------------------------------------------------------------
const Season = {
  LENGTH: 28, EPOCH: Date.UTC(2026, 8, 7) / 86400000,   // gün: sezon uzunluğu ve 1. sezonun başladığı gün (7 Eylül 2026, pazartesi)
  STEPS: 10, STEP: 300,            // basamak sayısı ve basamak başına puan
  TIERS: [['Larva', 0], ['Böcek', 600], ['Yuvarlayıcı', 1500], ['Şampiyon', 2700], ['Kutsal Skarabe', 4000]],
  REWARDS: [
    { type: 'trail', key: 'yildiz', name: 'Yıldız izi' }, { type: 'trail', key: 'alev', name: 'Kor izi' }, { type: 'trail', key: 'yaprak', name: 'Yaprak izi' },
    { type: 'title', key: 'yuvarlayici', name: 'Yuvarlayıcı' }, { type: 'title', key: 'firtina', name: 'Fırtına Ustası' }, { type: 'title', key: 'hirsiz', name: 'Top Hırsızı' },
    { type: 'xp', value: 150, name: '+150 puan' }, { type: 'xp', value: 300, name: '+300 puan' },
  ],
  init(key) {
    this.key = key + '-season';
    this.data = store.get(this.key, { index: -1, xp: 0, claimed: [], trails: [], titles: [], trail: null, title: null });
    const cur = this.current();
    if (this.data.index !== cur.index) { this.data.index = cur.index; this.data.xp = 0; this.data.claimed = []; this.save(); }
  },
  save() { store.set(this.key, this.data); },
  today() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); },
  current() { const days = this.today() - this.EPOCH; return { index: Math.floor(days / this.LENGTH), daysLeft: this.LENGTH - (days % this.LENGTH) }; },
  tier(xp = this.data.xp) { let t = this.TIERS[0]; for (const x of this.TIERS) if (xp >= x[1]) t = x; return t[0]; },
  addXp(n) { this.data.xp += Math.max(0, n | 0); this.save(); },
  stepNeed(k) { return this.STEP * k; },                                   // k = 1..STEPS
  claimable() { const out = []; for (let k = 1; k <= this.STEPS; k++) if (this.data.xp >= this.stepNeed(k) && !this.data.claimed.includes(k)) out.push(k); return out; },
  // Kum Kutusu: 3 farklı kart; sahip olunmayan kozmetikler öncelikli, en az bir puan kartı
  openBox() {
    const own = r => r.type === 'trail' ? this.data.trails.includes(r.key) : r.type === 'title' ? this.data.titles.includes(r.key) : false;
    const pool = this.REWARDS.filter(r => !own(r) && r.type !== 'xp').sort(() => Math.random() - 0.5);
    const xps = this.REWARDS.filter(r => r.type === 'xp').sort(() => Math.random() - 0.5);
    const cards = [...pool.slice(0, 2), xps[0]];
    while (cards.length < 3) cards.push(xps[cards.length - 1] || xps[0]);
    return cards.sort(() => Math.random() - 0.5);
  },
  claim(step, card) {
    if (this.data.claimed.includes(step)) return null;
    this.data.claimed.push(step);
    if (card.type === 'trail') { if (!this.data.trails.includes(card.key)) this.data.trails.push(card.key); this.data.trail = card.key; }
    else if (card.type === 'title') { if (!this.data.titles.includes(card.key)) this.data.titles.push(card.key); this.data.title = card.key; }
    this.save();
    return card;
  },
  // Ödül adı: çeviri varsa (kumul-dil.js) o, yoksa tanımdaki Türkçe
  rewardName(r) { if (typeof T !== 'function') return r.name; return r.type === 'xp' ? T('reward:xp', r.value) : T('reward:' + r.key); },
  titleName() { const r = this.REWARDS.find(x => x.type === 'title' && x.key === this.data.title); return r ? this.rewardName(r) : ''; },
};

// ---------------------------------------------------------------------
// Rakip hafızası: seni son eleyen bot. Sonraki turda aynı ad, huy ve görünümle sahadadır, başında taç;
// onu elersen ödeşme (tur puanı 2 kat) ve hafıza silinir. Üç kez eleyen "baş düşman" olur.
// ---------------------------------------------------------------------
const Nemesis = {
  init(key) { this.key = key + '-nemesis'; this.data = store.get(this.key, null); },
  get() { return this.data; },
  record(bot) {
    const same = this.data && this.data.name === bot.name;
    this.data = { name: bot.name, trait: bot.trait, skin: bot.skin, kills: same ? this.data.kills + 1 : 1 };
    store.set(this.key, this.data);
  },
  clear() { this.data = null; store.set(this.key, null); },
};

// ---------------------------------------------------------------------
// Kum Saati: üst üste oynanan günler. 3. günden itibaren 24 saatlik kum bulutu izi;
// seri kırılınca iz de gider (kayıptan kaçınma, kazanç isteğinden güçlüdür).
// ---------------------------------------------------------------------
const Streak = {
  TRAIL_DAYS: 3,
  init(key) { this.key = key + '-streak'; this.data = store.get(this.key, { days: 0, last: null, best: 0, trailUntil: 0 }); },
  today() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); },
  // Bugün oynandı. Dönüş: { days, extended (bugün ilk tur), broken (eski seri bozuldu), trail }
  touch() {
    const t = this.today(), d = this.data;
    let extended = false, broken = false;
    if (d.last !== t) {
      extended = true;
      if (d.last === t - 1) d.days++;
      else { broken = d.days >= 2; d.days = 1; }
      d.last = t; d.best = Math.max(d.best, d.days);
      if (d.days >= this.TRAIL_DAYS) d.trailUntil = Date.now() + 86400000;
      store.set(this.key, d);
    }
    return { days: d.days, extended, broken, best: d.best, trail: this.hasTrail() };
  },
  hasTrail() { return this.data.trailUntil > Date.now(); },
  trailHoursLeft() { return Math.max(0, Math.ceil((this.data.trailUntil - Date.now()) / 3600000)); },
};

<script>
// =====================================================================
// arena.js — Kumul (yılanlı kip): daralan arenalı, kısa turlu oyun
// Motor (engine.js) ve ajan beyni (agent.js) aynen kullanılır. Bu dosya
// yalnızca tur ayarlarını ve bot kadrosunu tanımlar. Ortak parçalar kumul-ortak.js içinde.
// =====================================================================

const ARENA = {
  size: 3600,           // başlangıç arena kenarı (birim)
  players: 30,          // insan dahil toplam yılan
  calm: 15,             // sn: fırtına beklemede
  shrinkEnd: 135,       // sn: arena midSize kenarına iner
  finalEnd: 165,        // sn: arena tamamen kapanır (tur en geç burada biter)
  midSize: 700,
  food: 900,
  powerUps: 10,
  // Botlar insandan biraz yavaş ve hatalı: yeni oyuncu ilk turda şans bulsun
  botDifficulty: { decisionInterval: 6, speedFactor: 0.9, noise: 0.2, huntRatioScale: 0.85, massCap: Infinity },
};

// Motor ölçeğini arena için ayarla (bu dosya yalnızca Kumul sayfasında yüklenir)
WORLD.width = ARENA.size; WORLD.height = ARENA.size;
WORLD.foodCount = ARENA.food; WORLD.maxFoods = 1500;
WORLD.visionRadius = 450;
WORLD.spawnProtection = 4;

// Kişilik ayarları sırayla dağıtılır
const BOT_TRAITS = [
  {},                                                              // dengeli
  { keepHeading: 0.4 },                                            // sabırlı
  { dangerEnter: 60,  dangerExit: 100, huntRatio: 0.8 },           // avcı
  { dangerWeight: 3.0 },                                           // sakin
  { huntRatio: 0.75, boostHuntDist: 220 },                         // hırslı
  { dangerEnter: 50,  dangerExit: 90,  huntRatio: 0.7 },           // cesur
  { dangerEnter: 110, dangerExit: 170, huntRatio: 0.4 },           // korkak
  { dangerWeight: 1.0, vetoDistance: 25 },                         // deli
  { keepHeading: 0.6, unreachableDist: 140 },                      // gezgin
  { goalWeight: 1.6, huntRatio: 0.5 },                             // obur
];

class Round extends RoundBase {
  constructor({ withPlayer = false, playerName = 'Sen', playerSkin = 0 } = {}) {
    super();
    this.world = new World({ respawn: false, powerUps: ARENA.powerUps, minFood: 25 });
    const botCount = ARENA.players - (withPlayer ? 1 : 0);
    const names = pickBotNames(botCount);
    const roster = names.map((name, i) => ({
      name,
      color: KUMUL_SKINS.filter(sk => !sk.ach)[(i * 5 + 3) % KUMUL_SKINS.filter(sk => !sk.ach).length].colors,
      config: BOT_TRAITS[i % BOT_TRAITS.length],
    }));
    this.world.addBots(roster, ARENA.botDifficulty);
    this.player = withPlayer ? this.world.addSnake(playerName, KUMUL_SKINS[playerSkin % KUMUL_SKINS.length].colors, null) : null;
    this.total = this.world.snakes.length;
  }
}
